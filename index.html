<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>BCA 3D Learning Platform - RAM vs ROM</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); max-width: 800px; width: 100%; }
        
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.3s; }
        .nav-btn.active { background: #007bff; }
        .nav-btn:hover { opacity: 0.9; }

        button.audio-btn { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        button.audio-btn:hover { background: #218838; transform: translateY(-2px); }
        
        .theory { font-size: 18px; line-height: 1.6; color: #333; margin-bottom: 20px; }
        .container3d { width: 100%; height: 450px; background: transparent; border-radius: 12px; overflow: hidden; border: 1px solid #ddd; }
        model-viewer { width: 100%; height: 100%; background-color: transparent; }
    </style>
    
    <!-- Model Viewer Script -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <div class="card">
        <h2 id="topic-title">विषय: RAM Fundamentals (Semester 1)</h2>
        
        <!-- 🔄 RAM aur ROM ke beech switch karne ke liye buttons -->
        <div class="nav-buttons">
            <button class="nav-btn active" id="btn-ram" onclick="showRAM()">RAM Model</button>
            <button class="nav-btn" id="btn-rom" onclick="showROM()">ROM Model</button>
        </div>

        <!-- 🔊 Sound System Button -->
        <button class="audio-btn" onclick="speakTopic()">🔊 Listen Explanation (Hindi)</button>
        
        <!-- 📖 Theory Text -->
        <p class="theory" id="theory-text">
            RAM का मतलब Random Access Memory है। यह कंप्यूटर की मुख्य मेमोरी होती है जो बहुत तेज़ होती है। जब आप कंप्यूटर पर कोई काम करते हैं, तो वह डेटा अस्थायी रूप से RAM में स्टोर होता है। कंप्यूटर बंद होने पर RAM का सारा डेटा डिलीट हो जाता है।
        </p>

        <!-- 📐 3D Model Display Area -->
        <div class="container3d">
            <model-viewer id="modelViewer" src="random_access_memory.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" shadow-intensity="1">
                <div class="progress-bar hide" slot="progress-bar">
                    <div class="update-bar"></div>
                </div>
                <button slot="ar-button" id="ar-button">
                    View in your space
                </button>
                <div id="ar-prompt">
                    <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
                </div>
            </model-viewer>
        </div>
    </div>

    <script>
        const ramText = "RAM का मतलब Random Access Memory है। यह कंप्यूटर की मुख्य मेमोरी होती है जो बहुत तेज़ होती है। जब आप कंप्यूटर पर कोई काम करते हैं, तो वह डेटा अस्थायी रूप से RAM में स्टोर होता है। कंप्यूटर बंद होने पर RAM का सारा डेटा डिलीट हो जाता है।";
        const romText = "ROM का मतलब Read Only Memory है। यह एक स्थायी मेमोरी है। इसमें कंप्यूटर को चालू करने के लिए ज़रूरी निर्देश पहले से लिखे होते हैं। कंप्यूटर बंद होने पर भी ROM का डेटा डिलीट नहीं होता है।";

        function showRAM() {
            document.getElementById('topic-title').innerText = "विषय: RAM Fundamentals (Semester 1)";
            document.getElementById('theory-text').innerText = ramText;
            document.getElementById('modelViewer').setAttribute('src', 'random_access_memory.glb');
            
            document.getElementById('btn-ram').classList.add('active');
            document.getElementById('btn-rom').classList.remove('active');
            window.speechSynthesis.cancel();
        }

        function showROM() {
            document.getElementById('topic-title').innerText = "विषय: ROM Fundamentals (Semester 1)";
            document.getElementById('theory-text').innerText = romText;
            document.getElementById('modelViewer').setAttribute('src', 'rom_cartridge.glb');
            
            document.getElementById('btn-rom').classList.add('active');
            document.getElementById('btn-ram').classList.remove('active');
            window.speechSynthesis.cancel();
        }

        function speakTopic() {
            window.speechSynthesis.cancel();
            const text = document.getElementById('theory-text').innerText;
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN'; 
            speech.rate = 0.95;    
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
