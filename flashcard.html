<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Learning Hub - 3D Flashcards Hub</title>

  <!-- Firebase Classic Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .matrix-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.12) 0%, rgba(2, 6, 23, 0.98) 80%),
        linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 50px 50px, 50px 50px;
    }

    /* 3D Flip Card Effect Setup */
    .perspective-1000 {
      perspective: 1000px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.75rem;
    }

    .card-front {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.15);
    }

    .card-back {
      background: rgba(24, 16, 43, 0.95);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(236, 72, 153, 0.5);
      transform: rotateY(180deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(236, 72, 153, 0.2);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #7e22ce; border-radius: 4px; }
  </style>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
        authDomain: "bca-learning-hub.firebaseapp.com",
        databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bca-learning-hub",
        storageBucket: "bca-learning-hub.firebasestorage.app",
        messagingSenderId: "206989105830",
        appId: "1:206989105830:web:93546fed295efab3017267",
        measurementId: "G-FF3GR0989C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allFlashcards = [];
    let currentFilter = "All";

    window.onload = function() {
      db.ref('bca_flashcards').on('value', (snapshot) => {
        const data = snapshot.val();
        allFlashcards = data ? Object.values(data) : getSampleCards();
        renderCards();
      });
    };

    function getSampleCards() {
      return [
        { semester: "Semester 1", topic: "C Programming", question: "Pointer kya hota hai?", answer: "Pointer ek aisa variable hota hai jo kisi doosre variable ka Memory Address store karta hai." },
        { semester: "Semester 1", topic: "Computer Fundamentals", question: "RAM vs ROM mein kya antar hai?", answer: "RAM Volatile (अस्थायी) मेमोरी है जो पावर ऑफ होने पर डेटा खो देती है, जबकि ROM Non-Volatile (स्थायी) होती है।" },
        { semester: "Semester 2", topic: "Data Structures", question: "Stack kis principle par kaam karta hai?", answer: "Stack LIFO (Last In First Out) सिद्धांत पर कार्य करता है।" },
        { semester: "Semester 3", topic: "DBMS", question: "Primary Key kya hai?", answer: "Primary Key एक यूनिक आइडेंटिफायर है जो टेबल के हर रिकॉर्ड को यूनिकली पहचानता है। इसमें Null वैल्यू नहीं हो सकती।" }
      ];
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = "";

      const filtered = currentFilter === "All" 
        ? allFlashcards 
        : allFlashcards.filter(c => c.semester === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 text-sm">Is Semester ke liye koi Flashcard nahi mila.</div>`;
        return;
      }

      filtered.forEach((card, index) => {
        container.innerHTML += `
          <div class="card-container perspective-1000 h-72 cursor-pointer" onclick="flipCard(this)">
            <div class="card-inner">
              
              <!-- Front Side -->
              <div class="card-front">
                <div>
                  <div class="flex justify-between items-center mb-3">
                    <span class="px-2.5 py-1 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 text-[10px] font-bold">${card.semester}</span>
                    <span class="text-[10px] text-gray-400 font-semibold"><i class="fa-solid fa-tag mr-1 text-purple-400"></i>${card.topic || 'General'}</span>
                  </div>
                  <h3 class="text-base font-bold text-white leading-snug mt-2">${card.question}</h3>
                </div>
                <div class="flex items-center justify-between pt-3 border-t border-purple-500/20 text-[11px] text-purple-400 font-semibold">
                  <span>💡 Click to Flip</span>
                  <i class="fa-solid fa-rotate text-xs"></i>
                </div>
              </div>

              <!-- Back Side -->
              <div class="card-back">
                <div>
                  <span class="text-[10px] uppercase tracking-wider text-pink-400 font-bold block mb-2">Answer / Explanation:</span>
                  <p class="text-xs text-gray-200 leading-relaxed font-normal">${card.answer}</p>
                </div>
                <div class="flex items-center justify-between pt-3 border-t border-pink-500/20 text-[11px] text-pink-400 font-semibold">
                  <span>✨ Tap to flip back</span>
                  <i class="fa-solid fa-arrow-left text-xs"></i>
                </div>
              </div>

            </div>
          </div>
        `;
      });
    }

    function flipCard(element) {
      element.classList.toggle('flipped');
    }

    function filterSem(sem) {
      currentFilter = sem;
      document.querySelectorAll('.sem-btn').forEach(btn => {
        btn.classList.remove('bg-purple-600', 'text-white');
        btn.classList.add('bg-slate-900', 'text-gray-300');
      });
      event.target.classList.remove('bg-slate-900', 'text-gray-300');
      event.target.classList.add('bg-purple-600', 'text-white');
      renderCards();
    }

    function openAdminModal() {
      let pass = prompt("🔑 Enter Admin Password:");
      if (pass === "sagar9955@#") {
        document.getElementById('adminModal').style.display = "flex";
      } else if (pass !== null) {
        alert("❌ Wrong Password!");
      }
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = "none";
    }

    function saveFlashcard(e) {
      e.preventDefault();
      const cardObj = {
        semester: document.getElementById('cardSem').value,
        topic: document.getElementById('cardTopic').value,
        question: document.getElementById('cardQ').value,
        answer: document.getElementById('cardA').value,
        timestamp: new Date().toLocaleString()
      };

      db.ref('bca_flashcards').push(cardObj).then(() => {
        alert("🎉 Flashcard Added Successfully!");
        document.getElementById('flashcardForm').reset();
        closeAdminModal();
      });
    }
  </script>
</head>
<body class="matrix-bg min-h-screen flex flex-col justify-between items-center p-4">

  <!-- Header -->
  <header class="w-full max-w-6xl py-4 flex justify-between items-center z-10">
    <div class="flex items-center space-x-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
        <i class="fa-solid fa-layer-group text-white text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-black tracking-tight text-white">3D Flashcard Hub</h1>
        <span class="text-xs text-purple-400 font-medium">Quick Revision Memory Arena</span>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <button onclick="openAdminModal()" class="px-3.5 py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold hover:bg-amber-500/20 transition flex items-center space-x-2 cursor-pointer">
        <i class="fa-solid fa-plus text-amber-400"></i>
        <span>Add Card</span>
      </button>
      <a href="index.html" class="px-3.5 py-2 rounded-xl bg-gray-900 border border-purple-500/30 text-gray-300 text-xs font-bold hover:bg-gray-800 transition flex items-center space-x-2">
        <i class="fa-solid fa-house text-purple-400"></i>
        <span>Home</span>
      </a>
    </div>
  </header>

  <!-- Filter Bar -->
  <main class="w-full max-w-6xl my-auto py-6 z-10">
    <div class="flex flex-wrap justify-center gap-2 mb-8">
      <button onclick="filterSem('All')" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white transition cursor-pointer">All Semesters</button>
      <button onclick="filterSem('Semester 1')" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 1</button>
      <button onclick="filterSem('Semester 2')" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 2</button>
      <button onclick="filterSem('Semester 3')" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 3</button>
      <button onclick="filterSem('Semester 4')" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 4</button>
      <button onclick="filterSem('Semester 5')" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 5</button>
      <button onclick="filterSem('Semester 6')" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 6</button>
    </div>

    <!-- Cards Grid Container -->
    <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 px-2">
      <!-- Dynamic Cards -->
    </div>
  </main>

  <!-- Admin Modal for Adding Flashcards -->
  <div id="adminModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 justify-center items-center p-4">
    <div class="bg-slate-900 border-2 border-purple-500 rounded-3xl p-6 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-purple-500/30">
        <h3 class="text-purple-300 font-bold text-sm"><i class="fa-solid fa-plus-circle mr-2"></i>Add New Flashcard</h3>
        <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white font-bold text-xs">❌ Close</button>
      </div>
      <form id="flashcardForm" onsubmit="saveFlashcard(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-purple-400 font-bold mb-1">Select Semester:</label>
          <select id="cardSem" class="w-full p-2.5 bg-slate-950 border border-purple-500/30 text-white rounded-xl" required>
            <option value="Semester 1">Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4">Semester 4</option>
            <option value="Semester 5">Semester 5</option>
            <option value="Semester 6">Semester 6</option>
          </select>
        </div>
        <div>
          <label class="block text-purple-400 font-bold mb-1">Topic / Subject Name:</label>
          <input type="text" id="cardTopic" placeholder="e.g. C Programming" class="w-full p-2.5 bg-slate-950 border border-purple-500/30 text-white rounded-xl" required>
        </div>
        <div>
          <label class="block text-purple-400 font-bold mb-1">Front Question (कार्ड के आगे का सवाल):</label>
          <textarea id="cardQ" placeholder="Write question..." class="w-full p-2.5 bg-slate-950 border border-purple-500/30 text-white rounded-xl h-16" required></textarea>
        </div>
        <div>
          <label class="block text-purple-400 font-bold mb-1">Back Answer (कार्ड के पीछे का उत्तर):</label>
          <textarea id="cardA" placeholder="Write detailed answer..." class="w-full p-2.5 bg-slate-950 border border-purple-500/30 text-white rounded-xl h-24" required></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-extrabold rounded-xl transition shadow-lg shadow-purple-500/30">
          🚀 Save Flashcard
        </button>
      </form>
    </div>
  </div>

  <footer class="w-full max-w-6xl py-4 text-center text-xs text-purple-500/60 z-10">
    © 2026 BCA Learning Hub | 3D Interactive Flashcards Hub
  </footer>

</body>
</html>
