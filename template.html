<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Topic Viewer - Rainbow 3D Project Notes</title>

    <!-- Firebase Classic Compatibility Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Google Model Viewer for 3D Models Support -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            color: #1f2937;
            padding-bottom: 80px;
        }

        /* Top Navigation Bar */
        nav { 
            background: rgba(13, 17, 23, 0.95); 
            backdrop-filter: blur(15px); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px 30px; 
            z-index: 1000; 
            border-bottom: 2px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-area h2 { font-size: 1.2rem; color: #fff; }
        .logo-area span { font-size: 0.75rem; color: #38bdf8; display: block; letter-spacing: 1px; font-weight: bold; }

        .nav-menu { display: flex; gap: 15px; list-style: none; align-items: center; }
        .nav-menu a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; padding: 6px 14px; border-radius: 8px; transition: 0.3s; }
        .nav-menu a:hover { background: rgba(79, 70, 229, 0.3); color: #fff; }

        .content-container { 
            max-width: 850px; 
            margin: 110px auto 40px auto; 
            padding: 0 20px; 
        }

        /* Rainbow Gradient Border Container */
        .rainbow-card-wrapper {
            position: relative;
            width: 100%;
            padding: 3px; 
            border-radius: 20px;
            background: linear-gradient(135deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
        }

        /* Inner Card Content Area */
        .rainbow-card-content {
            background: #ffffff;
            color: #1f2937;
            padding: 35px;
            border-radius: 18px;
            position: relative;
        }

        .card-badge {
            display: inline-block;
            background: #4f46e5;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .project-section-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .project-section-box h3 {
            font-size: 1.1rem;
            color: #111827;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-notes-text {
            font-size: 15px;
            line-height: 1.7;
            color: #374151;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .project-code-block {
            background: #111827;
            color: #38bdf8;
            padding: 16px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            overflow-x: auto;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .btn-toggle-answer {
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-toggle-answer:hover { background: #4338ca; }
        .qa-answer-content { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d1d5db; }

        .viewers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 12px;
        }

        .viewer-card-wrapper {
            background: #111827;
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: 0.3s;
        }

        .viewer-card-wrapper:hover {
            border-color: #4f46e5;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .viewer-container {
            width: 100%;
            height: 220px;
            background: radial-gradient(circle, #1f2937 0%, #111827 100%);
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .viewer-footer {
            padding: 10px 14px;
            background: #111827;
            color: #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
        }

        .card-footer {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #6b7280;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 10px;
        }

        .admin-action-bar { display: none; }
        .btn-admin-del { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 7px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 12px;
        }
        .btn-admin-del:hover { background: #dc2626; }

        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(13, 17, 23, 0.95); 
            backdrop-filter: blur(10px); 
            z-index: 2000; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        .modal-content { 
            width: 90%; 
            max-width: 850px; 
            height: 80vh; 
            background: #ffffff; 
            border: 3px solid #4f46e5; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .modal-header { 
            padding: 14px 20px; 
            background: #111827; 
            color: #fff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .modal-header h3 { color: #38bdf8; font-size: 1rem; }
        .close-modal-btn { 
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 6px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .modal-body { flex: 1; width: 100%; height: 100%; background: #111827; }
        .modal-body model-viewer { width: 100%; height: 100%; }

        .no-content { text-align: center; color: #cbd5e1; font-size: 1.1rem; padding: 80px; }
    </style>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
            authDomain: "bca-learning-hub.firebaseapp.com",
            databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bca-learning-hub",
            storageBucket: "bca-learning-hub.firebasestorage.app",
            messagingSenderId: "206989105830",
            appId: "1:206989105830:web:93546fed295efab3017267",
            measurementId: "G-FF3GR0989C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetTopicId = urlParams.get('id');

            const container = document.getElementById("dynamicTopics");

            db.ref('bca_topics').on('value', (snapshot) => {
                container.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = '<div class="no-content">⏳ Abhi koi topic card uploaded nahi hai. Admin panel se add karein!</div>';
                    return;
                }

                let entries = Object.entries(data);

                // Agar URL me specific ID hai toh wahi dikhao, nahi toh sabse pehla/latest topic dikhao taaki page blank na rahe
                if (targetTopicId) {
                    entries = entries.filter(([id, val]) => id === targetTopicId);
                } else {
                    // Default to the first/latest entry if no ID provided
                    let latestEntry = entries[entries.length - 1];
                    entries = [latestEntry];
                }

                if (entries.length === 0 || !entries[0]) {
                    container.innerHTML = '<div class="no-content">❌ Yeh topic nahi mila. <br><br><a href="index.html" style="color:#38bdf8;">← Home par jayein</a></div>';
                    return;
                }

                entries.forEach(([topicId, item]) => {
                    let viewersHtml = "";
                    if (item.models && item.models.length > 0) {
                        item.models.forEach((modelPath, mIndex) => {
                            let cleanPath = modelPath.trim();
                            if (cleanPath) {
                                viewersHtml += `
                                    <div class="viewer-card-wrapper" onclick="openFullscreenModal('${cleanPath}', '${item.title} - Model ${mIndex + 1}')">
                                        <div class="viewer-container">
                                            <model-viewer src="${cleanPath}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
                                        </div>
                                        <div class="viewer-footer">
                                            <span>📦 Model #${mIndex + 1}</span>
                                            <span style="color:#38bdf8;">[Zoom 🔍]</span>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }

                    let cardHtml = `
                        <div class="rainbow-card-wrapper">
                            <div class="rainbow-card-content">
                                <span class="card-badge">${item.semester || 'BCA Semester'}</span>
                                <h1>${item.title || 'Untitled Topic'}</h1>

                                <div class="project-section-box">
                                    <p class="project-notes-text"><strong>📖 Definition & Overview:</strong><br>${item.definition || 'No definition provided.'}</p>
                                </div>

                                ${item.qa ? `
                                <div class="project-section-box">
                                    <h3>
                                        <span>❓ Important Questions & Answers:</span>
                                        <button class="btn-toggle-answer" onclick="toggleAnswer('${topicId}')" id="btn_qa_${topicId}">👁️ Show Answer</button>
                                    </h3>
                                    <div class="qa-answer-content" id="qa_content_${topicId}">
                                        <p class="project-notes-text">${item.qa}</p>
                                    </div>
                                </div>` : ''}

                                ${viewersHtml ? `
                                <div class="project-section-box">
                                    <h3>🧊 Interactive 3D Models:</h3>
                                    <div class="viewers-grid">
                                        ${viewersHtml}
                                    </div>
                                </div>` : ''}

                                ${item.lab ? `
                                <div class="project-section-box">
                                    <h3>💻 Practical Lab Code Task:</h3>
                                    <div class="project-code-block">${item.lab}</div>
                                </div>` : ''}

                                <div class="card-footer">
                                    <span>Status: Live Synced</span>
                                    <span>Posted: ${item.timestamp || 'Recent'}</span>
                                    <div class="admin-action-bar" id="admin_bar_${topicId}">
                                        <button class="btn-admin-del" onclick="deleteTopic('${topicId}')">🗑️ Delete Card</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHtml;
                });

                if(sessionStorage.getItem("bca_admin_auth") === "true") {
                    document.querySelectorAll('.admin-action-bar').forEach(bar => bar.style.display = "block");
                }
            });
        };

        function toggleAnswer(topicId) {
            const content = document.getElementById(`qa_content_${topicId}`);
            const btn = document.getElementById(`btn_qa_${topicId}`);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.innerHTML = "👁️ Show Answer";
            } else {
                content.style.display = "block";
                btn.innerHTML = "🔒 Hide Answer";
            }
        }

        function verifyAdminForView() {
            let pass = prompt("🔐 Enter Admin Password:");
            if (pass === "BCA@Admin#2026!Secured") {
                sessionStorage.setItem("bca_admin_auth", "true");
                document.querySelectorAll('.admin-action-bar').forEach(bar => bar.style.display = "block");
                alert("Admin Mode Unlocked!");
            } else if(pass !== null) {
                alert("Wrong Password!");
            }
        }

        function deleteTopic(topicId) {
            if (confirm("⚠️ Is topic card ko permanently delete karna chahte hain?")) {
                db.ref('bca_topics/' + topicId).remove()
                  .then(() => { alert("🗑️ Topic Deleted!"); window.location.href = "index.html"; });
            }
        }

        function openFullscreenModal(modelSrc, modelTitle) {
            document.getElementById("modalTitle").innerText = modelTitle;
            document.getElementById("modalViewerContainer").innerHTML = `<model-viewer src="${modelSrc}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1"></model-viewer>`;
            document.getElementById("modalOverlay").style.display = "flex"; // Updated ID reference
        }

        function closeFullscreenModal() {
            document.getElementById("modalOverlay").style.display = "none";
            document.getElementById("modalViewerContainer").innerHTML = "";
        }
    </script>
</head>
<body>

    <nav>
        <div class="logo-area">
            <h2>🎓 BCA Learning Hub</h2>
            <span>3D Immersive Education</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html">⚡ Quiz Arena</a></li>
            <li><a href="#" onclick="verifyAdminForView()" style="color: #f87171; font-size: 0.85rem; font-weight: bold;">🔐 Admin Mode</a></li>
        </ul>
    </nav>

    <div class="content-container">
        <div id="dynamicTopics">
            <div class="no-content">⏳ Loading Rainbow 3D Cards...</div>
        </div>
    </div>

    <!-- Fullscreen Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">3D Model Interactive View</h3>
                <button class="close-modal-btn" onclick="closeFullscreenModal()">❌ Close [X]</button>
            </div>
            <div class="modal-body" id="modalViewerContainer"></div>
        </div>
    </div>

</body>
</html>
