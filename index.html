<!-- 2. ADMIN BULK QUIZ CREATOR FORM (20+ Questions Copy-Paste System) -->
<div class="admin-panel" id="adminQuizPanel">
    <h2>🎯 2. Admin Bulk Quiz Designer (Copy-Paste 20+ Questions)</h2>
    <form id="bulkQuizForm" onsubmit="saveBulkQuizData(event)">
        <div class="form-group">
            <label>Select Semester & Chapter/Topic:</label>

            <select id="quizSem" required>
                <option value="Sem 1 - Computer Fundamentals">Semester 1 - Computer Fundamentals</option>
                <option value="Sem 2 - Data Structures">Semester 2 - Data Structures</option>
                <option value="Sem 3 - DBMS & Java">Semester 3 - DBMS & Java</option>
                <option value="Sem 4 - Web Tech">Semester 4 - Web Tech</option>
                <option value="Sem 5 - Cyber Security">Semester 5 - Cyber Security</option>
                <option value="Sem 6 - AI & Android">Semester 6 - AI & Android</option>
            </select>
        </div>

        <div class="form-group">
            <label>Topic Title:</label>
            <input type="text" id="quizTopicTitle" placeholder="e.g. CPU & Registers 20 Question Set" required>
        </div>

        <div class="form-group">
            <label>Paste 20+ Questions Here (Bulk Format):</label>
            <textarea id="bulkQuizText" style="height: 250px; font-family: monospace;" placeholder="Niche diye gaye format mein 20+ questions paste karein:

Q: What is the brain of the computer?
A: ALU
B: Control Unit
C: CPU
D: RAM
Ans: C

Q: Which memory is volatile?
A: ROM
B: RAM
C: Hard Disk
D: SSD
Ans: B" required></textarea>
        </div>

        <button type="submit" class="btn-publish">🚀 Save 20+ Questions & Publish Quiz</button>
    </form>
</div>

<script>
function saveBulkQuizData(e) {
    e.preventDefault();
    let sem = document.getElementById("quizSem").value;
    let topic = document.getElementById("quizTopicTitle").value;
    let rawText = document.getElementById("bulkQuizText").value;

    let blocks = rawText.split(/\n\s*\n/);
    let parsedQuestions = [];

    blocks.forEach(block => {
        let lines = block.split('\n').map(l => l.trim()).filter(l => l !== "");
        if(lines.length >= 6) {
            let q = lines[0].replace(/^Q:\s*/i, '');
            let optA = lines[1].replace(/^A:\s*/i, '');
            let optB = lines[2].replace(/^B:\s*/i, '');
            let optC = lines[3].replace(/^C:\s*/i, '');
            let optD = lines[4].replace(/^D:\s*/i, '');
            let ans = lines[5].replace(/^Ans:\s*/i, '').toUpperCase();

            parsedQuestions.push({
                question: q,
                options: [optA, optB, optC, optD],
                correct: ans
            });
        }
    });

    if(parsedQuestions.length === 0) {
        alert("⚠️ Please check question format!");
        return;
    }

    let quizPayload = {
        semester: sem,
        topic: topic,
        questions: parsedQuestions,
        timestamp: new Date().toLocaleString()
    };

    let existingQuizzes = JSON.parse(localStorage.getItem("bca_quizzes") || "[]");
    existingQuizzes.push(quizPayload);
    localStorage.setItem("bca_quizzes", JSON.stringify(existingQuizzes));

    alert("🎉 Successfully added " + parsedQuestions.length + " Questions to Quiz Arena!");
    document.getElementById("bulkQuizForm").reset();
}
</script>
