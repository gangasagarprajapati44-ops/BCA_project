<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Topic Viewer - Immersive 3D Education</title>

    <!-- Firebase Classic Compatibility Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Google Model Viewer for 3D Models Support -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body { 
            background: linear-gradient(135deg, #03071e 0%, #0b132b 50%, #1c2541 100%);
            background-attachment: fixed;
            color: #e2e8f0; 
            min-height: 100vh;
            padding-bottom: 80px;
            line-height: 1.7;
        }

        nav { 
            background: rgba(11, 19, 43, 0.9); 
            backdrop-filter: blur(16px); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px 30px; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(76, 201, 240, 0.25); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .logo-area h2 { font-size: 1.3rem; color: #fff; text-shadow: 0 0 12px rgba(76,201,240,0.6); }
        .logo-area span { font-size: 0.75rem; color: #4cc9f0; display: block; letter-spacing: 1.5px; font-weight: 600; }

        .nav-menu { display: flex; gap: 15px; list-style: none; align-items: center; }
        .nav-menu a { color: #cfd9df; text-decoration: none; font-size: 0.95rem; padding: 6px 15px; border-radius: 8px; transition: 0.3s; font-weight: 500; }
        .nav-menu a:hover { background: rgba(58, 134, 255, 0.25); color: #fff; }

        .content-container { max-width: 950px; margin: 110px auto 40px auto; padding: 0 20px; }

        .topic-card {
            background: rgba(28, 37, 65, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(76, 201, 240, 0.35);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            margin-bottom: 40px;
            position: relative;
        }

        .topic-title { 
            color: #ffffff; 
            font-size: 2.2rem; 
            margin-bottom: 10px; 
            background: linear-gradient(to right, #ffffff, #4cc9f0, #3a86ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            border-bottom: 2px solid rgba(76, 201, 240, 0.25);
            padding-bottom: 15px;
        }
        
        .topic-meta { 
            color: #ff9800; 
            font-size: 0.95rem; 
            margin-bottom: 30px; 
            font-weight: 600; 
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            text-transform: uppercase;
        }
        
        .section-box { 
            background: rgba(11, 19, 43, 0.7); 
            padding: 25px; 
            border-radius: 16px; 
            margin-bottom: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }
        
        .section-box h3 { 
            color: #4cc9f0; 
            margin-bottom: 14px; 
            font-size: 1.25rem; 
            font-weight: 700;
            border-left: 4px solid #3a86ff;
            padding-left: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-box p { color: #e2e8f0; font-size: 1.05rem; line-height: 1.8; white-space: pre-wrap; }
        .section-box pre {
            background: rgba(5, 10, 25, 0.95);
            padding: 18px;
            border-radius: 10px;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.95rem;
            overflow-x: auto;
            white-space: pre-wrap;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Q&A Hide/Show Button */
        .btn-toggle-answer {
            background: linear-gradient(135deg, #3a86ff, #2563eb);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(58,134,255,0.4);
        }
        .btn-toggle-answer:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .qa-answer-content { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(76,201,240,0.3); }

        /* 3D Viewers Grid */
        .viewers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .viewer-card-wrapper {
            background: rgba(5, 10, 25, 0.85);
            border-radius: 14px;
            border: 2px solid rgba(76, 201, 240, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: 0.3s;
        }
        .viewer-card-wrapper:hover { transform: translateY(-5px); border-color: #4cc9f0; box-shadow: 0 10px 30px rgba(76, 201, 240, 0.3); }
        .viewer-container { width: 100%; height: 260px; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        model-viewer { width: 100%; height: 100%; }
        .viewer-footer { padding: 12px 15px; background: rgba(11, 19, 43, 0.95); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(76, 201, 240, 0.2); }
        .viewer-title { font-size: 0.9rem; color: #cbd5e1; font-weight: 600; }
        .expand-hint { font-size: 0.75rem; background: #3a86ff; color: #fff; padding: 4px 8px; border-radius: 6px; font-weight: bold; }

        /* Admin Delete/Edit Action Bar */
        .admin-action-bar { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,152,0,0.3); gap: 10px; }
        .btn-admin-del { background: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-admin-edit { background: #ff9800; color: #000; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Fullscreen Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 30, 0.92); backdrop-filter: blur(15px); z-index: 2000; justify-content: center; align-items: center; padding: 30px; }
        .modal-content { width: 90%; max-width: 900px; height: 80vh; background: #0b132b; border: 2px solid #4cc9f0; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(76, 201, 240, 0.5); }
        .modal-header { padding: 15px 25px; background: #1c2541; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(76, 201, 240, 0.3); }
        .modal-header h3 { color: #4cc9f0; font-size: 1.2rem; }
        .close-modal-btn { background: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .modal-body { flex: 1; width: 100%; height: 100%; }
        .modal-body model-viewer { width: 100%; height: 100%; }

        .no-content { text-align: center; color: #a5b4fc; font-size: 1.2rem; padding: 80px; }
    </style>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
            authDomain: "bca-learning-hub.firebaseapp.com",
            databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bca-learning-hub",
            storageBucket: "bca-learning-hub.firebasestorage.app",
            messagingSenderId: "206989105830",
            appId: "1:206989105830:web:93546fed295efab3017267",
            measurementId: "G-FF3GR0989C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAdminUnlocked = false;

        window.onload = function() {
            // Check URL parameters to see if a specific topic ID was requested
            const urlParams = new URLSearchParams(window.location.search);
            const targetTopicId = urlParams.get('id');

            const container = document.getElementById("dynamicTopics");

            db.ref('bca_topics').on('value', (snapshot) => {
                container.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = '<div class="no-content">⏳ Abhi koi topic uploaded nahi hai. Admin panel se content publish karein!</div>';
                    return;
                }

                // If specific topic ID is requested, filter it; otherwise show all or latest
                let entries = Object.entries(data); // [ [id, obj], [id, obj] ]
                if (targetTopicId) {
                    entries = entries.filter(([id, val]) => id === targetTopicId);
                }

                if (entries.length === 0) {
                    container.innerHTML = '<div class="no-content">❌ Maaf kijiye, yeh topic nahi mila ya delete ho chuka hai.</div>';
                    return;
                }

                entries.reverse().forEach(([topicId, item], index) => {
                    let viewersHtml = "";
                    if (item.models && item.models.length > 0) {
                        item.models.forEach((modelPath, mIndex) => {
                            let cleanPath = modelPath.trim();
                            if (cleanPath) {
                                viewersHtml += `
                                    <div class="viewer-card-wrapper" onclick="openFullscreenModal('${cleanPath}', '${item.title} - Model ${mIndex + 1}')">
                                        <div class="viewer-container">
                                            <model-viewer src="${cleanPath}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
                                        </div>
                                        <div class="viewer-footer">
                                            <span class="viewer-title">📦 Model ${mIndex + 1}</span>
                                            <span class="expand-hint">🔍 Zoom Fullscreen</span>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }

                    let cardHtml = `
                        <div class="topic-card" id="card_${topicId}">
                            <h2 class="topic-title">${item.title}</h2>
                            <div class="topic-meta">
                                <span>🎓 ${item.semester}</span>
                                <span>🕒 ${item.timestamp || 'Recent'}</span>
                            </div>

                            <div class="section-box">
                                <h3>📖 Definition & Real-World Example</h3>
                                <p>${item.definition}</p>
                            </div>

                            ${item.qa ? `
                            <div class="section-box">
                                <h3>
                                    <span>❓ Important Q&A Box</span>
                                    <button class="btn-toggle-answer" onclick="toggleAnswer('${topicId}')" id="btn_qa_${topicId}">👁️ Show Answer</button>
                                </h3>
                                <div class="qa-answer-content" id="qa_content_${topicId}">
                                    <p>${item.qa}</p>
                                </div>
                            </div>` : ''}

                            ${viewersHtml ? `
                            <div class="section-box">
                                <h3>🧊 Interactive 3D Visualizer Boxes</h3>
                                <div class="viewers-grid">
                                    ${viewersHtml}
                                </div>
                            </div>` : ''}

                            ${item.lab ? `
                            <div class="section-box">
                                <h3>💻 Practical Lab Activity & Code Task</h3>
                                <pre>${item.lab}</pre>
                            </div>` : ''}

                            <div class="admin-action-bar" id="admin_bar_${topicId}">
                                <button class="btn-admin-del" onclick="deleteTopic('${topicId}')">🗑️ Delete Topic</button>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHtml;
                });

                // Check if admin was previously unlocked in session
                if(sessionStorage.getItem("bca_admin_auth") === "true") {
                    enableAdminUI();
                }
            });
        };

        function toggleAnswer(topicId) {
            const content = document.getElementById(`qa_content_${topicId}`);
            const btn = document.getElementById(`btn_qa_${topicId}`);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.innerHTML = "👁️ Show Answer";
            } else {
                content.style.display = "block";
                btn.innerHTML = "🔒 Hide Answer";
            }
        }

        function verifyAdminForView() {
            let pass = prompt("🔐 Enter Admin Password to Unlock Management Tools:");
            if (pass === "BCA@Admin#2026!Secured") {
                sessionStorage.setItem("bca_admin_auth", "true");
                enableAdminUI();
                alert("Admin Controls Unlocked!");
            } else if(pass !== null) {
                alert("Wrong Password!");
            }
        }

        function enableAdminUI() {
            isAdminUnlocked = true;
            document.querySelectorAll('.admin-action-bar').forEach(bar => {
                bar.style.display = "flex";
            });
        }

        function deleteTopic(topicId) {
            if (confirm("⚠️ Kya aap is topic ko permanently delete karna chahte hain?")) {
                db.ref('bca_topics/' + topicId).remove()
                  .then(() => alert("🗑️ Topic Successfully Deleted!"))
                  .catch(err => alert("Error: " + err.message));
            }
        }

        function openFullscreenModal(modelSrc, modelTitle) {
            const modal = document.getElementById("fullscreenModal");
            const modalViewerContainer = document.getElementById("modalViewerContainer");
            document.getElementById("modalTitle").innerText = modelTitle;
            modalViewerContainer.innerHTML = `<model-viewer src="${modelSrc}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1"></model-viewer>`;
            modal.style.display = "flex";
        }

        function closeFullscreenModal() {
            document.getElementById("fullscreenModal").style.display = "none";
            document.getElementById("modalViewerContainer").innerHTML = "";
        }
    </script>
</head>
<body>

    <nav>
        <div class="logo-area">
            <h2>🎓 BCA Learning Hub</h2>
            <span>3D Immersive Education</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html">⚡ Quiz Arena</a></li>
            <li><a href="template.html" style="color: #4cc9f0; font-weight: bold;">Topic Viewer</a></li>
            <li><a href="#" onclick="verifyAdminForView()" style="color: #ff9800; font-size: 0.85rem;">🔐 Admin Mode</a></li>
        </ul>
    </nav>

    <div class="content-container">
        <h1 style="text-align: center; margin-bottom: 35px; color: #4cc9f0; font-weight: 800;">📚 BCA Detailed Study & 3D Lab</h1>
        <div id="dynamicTopics">
            <div class="no-content">⏳ Loading Topics from Cloud Database...</div>
        </div>
    </div>

    <!-- Fullscreen Modal -->
    <div class="modal-overlay" id="fullscreenModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">3D Model Viewer</h3>
                <button class="close-modal-btn" onclick="closeFullscreenModal()">❌ Close [X]</button>
            </div>
            <div class="modal-body" id="modalViewerContainer"></div>
        </div>
    </div>

</body>
</html>
