<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Learning Hub - Topic Viewer</title>
  
  <!-- Firebase Classic Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Google Model Viewer for 3D Models Support -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@700&family=Pacifico&family=Reenie+Beanie&family=VT323&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f3f4f6;
      overflow-x: hidden;
    }

    /* Glassmorphism Panel with Cyan/Teal Tech Tint */
    .glass-panel-cyan {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* Cyan Neon Gradient Border */
    .neon-border-cyan {
      position: relative;
    }
    .neon-border-cyan::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 1.75rem;
      padding: 2px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #10b981, #6366f1);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Cyber Matrix Background */
    .matrix-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.12) 0%, rgba(2, 6, 23, 0.98) 80%),
        linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 50px 50px, 50px 50px;
    }

    .viewers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 12px;
    }

    .viewer-card-wrapper {
      background: #0b0f19;
      border-radius: 12px;
      border: 2px solid rgba(6, 182, 212, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: 0.3s;
    }

    .viewer-card-wrapper:hover {
      border-color: #06b6d4;
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .viewer-container {
      width: 100%;
      height: 220px;
      background: radial-gradient(circle, #1e293b 0%, #0b0f19 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewer-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      transition: 0.3s;
    }

    .viewer-card-wrapper:hover .viewer-container img {
      transform: scale(1.05);
    }

    model-viewer { width: 100%; height: 100%; }

    .viewer-footer {
      padding: 10px 14px;
      background: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .modal-overlay { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(2, 6, 23, 0.95); 
      backdrop-filter: blur(10px); 
      z-index: 2000; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
    }

    .modal-content { 
      width: 90%; 
      max-width: 850px; 
      height: 80vh; 
      background: #0f172a; 
      border: 3px solid #06b6d4; 
      border-radius: 16px; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }

    .modal-header { 
      padding: 14px 20px; 
      background: #0b0f19; 
      color: #fff; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .modal-header h3 { color: #38bdf8; font-size: 1rem; }
    .close-modal-btn { 
      background: #ef4444; 
      color: white; 
      border: none; 
      padding: 6px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
    }
    .modal-body { flex: 1; width: 100%; height: 100%; background: #0b0f19; display: flex; align-items: center; justify-content: center; overflow: auto; }
    .modal-body model-viewer { width: 100%; height: 100%; }
    .modal-body img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .drop-zone {
      border: 2px dashed rgba(6, 182, 212, 0.6);
      background: rgba(15, 23, 42, 0.8);
      padding: 25px;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #38bdf8;
      background: rgba(6, 182, 212, 0.15);
    }

    .wordart-neon {
      color: #fff !important;
      text-shadow: 0 0 5px #06b6d4, 0 0 10px #06b6d4, 0 0 20px #06b6d4 !important;
    }
    .wordart-fire {
      background: linear-gradient(to right, #f59e0b, #ef4444) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      font-weight: 900 !important;
    }
    .wordart-cyber {
      background: linear-gradient(to right, #38bdf8, #a855f7) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      font-weight: 900 !important;
      letter-spacing: 2px !important;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #0e7490; border-radius: 4px; }
  </style>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
        authDomain: "bca-learning-hub.firebaseapp.com",
        databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bca-learning-hub",
        storageBucket: "bca-learning-hub.firebasestorage.app",
        messagingSenderId: "206989105830",
        appId: "1:206989105830:web:93546fed295efab3017267",
        measurementId: "G-FF3GR0989C"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentTopicId = null;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        currentTopicId = urlParams.get('id');

        if (sessionStorage.getItem("bca_admin_auth") === "true") {
            let adminBtns = document.getElementById('adminActionButtons');
            if(adminBtns) adminBtns.style.display = "flex";
        }

        db.ref('bca_topics').on('value', (snapshot) => {
            const data = snapshot.val();
            const sidebarList = document.getElementById('sidebarTopicList');
            sidebarList.innerHTML = "";
            if (data) {
                Object.entries(data).forEach(([id, item]) => {
                    let activeClass = (id === currentTopicId) ? "bg-cyan-500/20 text-cyan-300 border-cyan-500" : "bg-gray-950/60 text-gray-300 border-gray-800 hover:bg-gray-900";
                    sidebarList.innerHTML += `
                        <a href="template.html?id=${id}" class="block p-3 rounded-xl border text-xs font-semibold transition ${activeClass}">
                            📚 ${item.title} <span class="block text-[10px] text-cyan-400 mt-0.5">(${item.semester})</span>
                        </a>
                    `;
                });
            } else {
                sidebarList.innerHTML = "<p class='text-xs text-gray-500'>No topics found.</p>";
            }
        });

        if (currentTopicId) {
            db.ref('bca_topics/' + currentTopicId).once('value').then((snapshot) => {
                const topic = snapshot.val();
                if (topic) {
                    renderTopicContent(topic);
                } else {
                    document.getElementById('displayTitle').innerText = "Topic Not Found";
                    document.getElementById('displayDef').innerText = "Requested topic data does not exist in database.";
                }
            });
        } else {
            document.getElementById('displayTitle').innerText = "Select a Topic";
            document.getElementById('displaySemester').innerText = "BCA Hub";
            document.getElementById('displayDef').innerText = "Please select any topic from the left sidebar or home page search to view comprehensive study notes, 3D model previews, and lab codes.";
        }
        setupDragAndDrop();
    };

    function renderTopicContent(topic) {
        document.getElementById('displaySemester').innerText = topic.semester || "Semester 1";
        
        let titleEl = document.getElementById('displayTitle');
        titleEl.innerText = topic.title || "";
        titleEl.style.fontFamily = topic.fontStyle || "'Inter', sans-serif";
        titleEl.style.color = topic.textColor || "#ffffff";
        titleEl.className = `text-2xl sm:text-3xl font-extrabold tracking-tight mb-2 ${topic.wordArt || ''}`;

        let defEl = document.getElementById('displayDef');
        defEl.innerText = topic.definition || "";
        defEl.style.fontFamily = topic.fontStyle || "'Inter', sans-serif";
        defEl.style.color = topic.textColor || "#cbd5e1";

        let qaEl = document.getElementById('displayQA');
        qaEl.innerText = topic.qa || "No extra Q&A specified.";
        qaEl.style.fontFamily = topic.fontStyle || "'Inter', sans-serif";

        document.getElementById('displayLab').innerText = topic.lab || "// No code snippet provided.";

        // Render 3D Model Viewers
        let viewersHtml = "";
        if (topic.models && topic.models.length > 0) {
            topic.models.forEach((modelPath, mIndex) => {
                let cleanPath = modelPath.trim();
                if (cleanPath) {
                    viewersHtml += `
                        <div class="viewer-card-wrapper" onclick="openFullscreenModal('${cleanPath}', '${topic.title} - Model ${mIndex + 1}', 'model')">
                            <div class="viewer-container">
                                <model-viewer src="${cleanPath}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
                            </div>
                            <div class="viewer-footer">
                                <span>📦 Model #${mIndex + 1}</span>
                                <span style="color:#38bdf8;">[Zoom 🔍]</span>
                            </div>
                        </div>
                    `;
                }
            });
        }
        document.getElementById('modelViewersSection').innerHTML = viewersHtml ? viewersHtml : "<p class='text-xs text-gray-500'>No 3D models attached for this topic.</p>";

        // Render Diagram Viewers Box with Strict Validation
        let diagramsHtml = "";
        let validCount = 0;
        if (topic.diagrams && topic.diagrams.length > 0) {
            topic.diagrams.forEach((diagPath) => {
                let cleanDiag = diagPath.trim();
                
                if (cleanDiag) {
                    if (!cleanDiag.startsWith('http') && !cleanDiag.startsWith('data:') && !cleanDiag.startsWith('images/')) {
                        if (cleanDiag.length > 100) {
                            cleanDiag = 'data:image/png;base64,' + cleanDiag;
                        } else {
                            return;
                        }
                    }

                    validCount++;
                    diagramsHtml += `
                        <div class="viewer-card-wrapper" onclick="openFullscreenModal('${cleanDiag}', '${topic.title} - Diagram ${validCount}', 'image')">
                            <div class="viewer-container">
                                <img src="${cleanDiag}" alt="Diagram ${validCount}" onerror="this.parentElement.parentElement.remove();">
                            </div>
                            <div class="viewer-footer">
                                <span>📊 Diagram #${validCount}</span>
                                <span style="color:#38bdf8;">[View 🔍]</span>
                            </div>
                        </div>
                    `;
                }
            });
        }
        document.getElementById('diagramViewersSection').innerHTML = (diagramsHtml && validCount > 0) ? diagramsHtml : "<p class='text-xs text-gray-500'>No diagrams attached for this topic.</p>";
    }

    function setupDragAndDrop() {
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        if (!dropZone || !fileInput) return;

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });
    }

    function handleFiles(files) {
        const diagramsField = document.getElementById('editDiagrams');
        let currentVal = diagramsField.value.trim();
        let pathsArray = currentVal ? currentVal.split(',').map(i => i.trim()).filter(i => i !== "" && i.length > 10) : [];

        Array.from(files).forEach(file => {
            if (file.type.startsWith('image/')) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    pathsArray.push(e.target.result);
                    diagramsField.value = pathsArray.join(', ');
                };
                reader.readAsDataURL(file);
            }
        });
    }

    function openEditModal() {
        if (!currentTopicId) return alert("No topic selected to edit!");
        db.ref('bca_topics/' + currentTopicId).once('value').then((snapshot) => {
            const topic = snapshot.val();
            if(topic) {
                document.getElementById('editSem').value = topic.semester || "Semester 1";
                document.getElementById('editTitle').value = topic.title || "";
                document.getElementById('editDef').value = topic.definition || "";
                document.getElementById('editQA').value = topic.qa || "";
                document.getElementById('editModels').value = topic.models ? topic.models.join(', ') : "";
                
                let cleanDiagramsList = topic.diagrams ? topic.diagrams.filter(d => d.trim().length > 20) : [];
                document.getElementById('editDiagrams').value = cleanDiagramsList.join(', ');
                
                document.getElementById('editLab').value = topic.lab || "";
                document.getElementById('editFontStyle').value = topic.fontStyle || "Inter";
                document.getElementById('editTextColor').value = topic.textColor || "#ffffff";
                document.getElementById('editWordArt').value = topic.wordArt || "";
                
                document.getElementById('editModalOverlay').style.display = "flex";
            }
        });
    }

    function closeEditModal() {
        document.getElementById('editModalOverlay').style.display = "none";
    }

    function clearAllDiagrams() {
        if (confirm("Kya aap saare diagrams clear karke fir se new upload karna chahte hain?")) {
            document.getElementById('editDiagrams').value = "";
        }
    }

    function saveEditedTopic(e) {
        e.preventDefault();
        
        let cleanDiagrams = document.getElementById("editDiagrams").value.split(',')
            .map(i => i.trim())
            .filter(i => i !== "" && i.length > 20);

        let updatedObject = {
            semester: document.getElementById("editSem").value,
            title: document.getElementById("editTitle").value,
            definition: document.getElementById("editDef").value,
            qa: document.getElementById("editQA").value,
            models: document.getElementById("editModels").value.split(',').map(i => i.trim()).filter(i => i !== ""),
            diagrams: cleanDiagrams,
            lab: document.getElementById("editLab").value,
            fontStyle: document.getElementById("editFontStyle").value,
            textColor: document.getElementById("editTextColor").value,
            wordArt: document.getElementById("editWordArt").value,
            timestamp: new Date().toLocaleString()
        };

        db.ref('bca_topics/' + currentTopicId).update(updatedObject).then(() => {
            alert("🎉 Topic Updated Successfully!");
            closeEditModal();
            location.reload();
        });
    }

    function deleteCurrentTopic() {
        if (!currentTopicId) return;
        if (confirm("⚠️ Kya aap sach mein is topic ko delete karna chahte hain?")) {
            db.ref('bca_topics/' + currentTopicId).remove().then(() => {
                alert("🗑️ Topic Deleted Successfully!");
                window.location.href = "index.html";
            });
        }
    }

    function openFullscreenModal(src, title, type) {
        document.getElementById("modalTitle").innerText = title;
        let container = document.getElementById("modalViewerContainer");
        if (type === 'model') {
            container.innerHTML =
