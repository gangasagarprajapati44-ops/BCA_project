<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Learning Hub - Hologram Sci-Fi Quiz Arena</title>

  <!-- Firebase Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Three.js for Hologram Particle Background & Audio Waves -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@600;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Iron Man Style Hologram Glass */
    .hologram-screen {
      background: rgba(6, 182, 212, 0.06);
      backdrop-filter: blur(18px);
      border: 2px solid rgba(6, 182, 212, 0.5);
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.25), inset 0 0 25px rgba(6, 182, 212, 0.15);
      animation: hologramPulse 4s infinite alternate;
    }

    @keyframes hologramPulse {
      0% { border-color: rgba(6, 182, 212, 0.4); box-shadow: 0 0 30px rgba(6, 182, 212, 0.2); }
      100% { border-color: rgba(56, 189, 248, 0.8); box-shadow: 0 0 50px rgba(56, 189, 248, 0.4); }
    }

    /* Neon Shockwave on Correct Answer */
    @keyframes neonShockwave {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .correct-shockwave {
      animation: neonShockwave 0.8s ease-out;
      background: rgba(16, 185, 129, 0.3) !important;
      border-color: #10b981 !important;
      color: #34d399 !important;
    }

    /* Digital Glitch on Wrong Answer */
    @keyframes glitchEffect {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
      40% { transform: translate(-3px, -3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); }
      100% { transform: translate(0); }
    }

    .glitch-anim {
      animation: glitchEffect 0.3s ease infinite;
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.2) !important;
    }

    .topic-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 182, 212, 0.35);
      transition: all 0.3s ease;
    }
    .topic-card:hover {
      transform: translateY(-6px);
      border-color: #06b6d4;
      box-shadow: 0 15px 35px rgba(6, 182, 212, 0.3);
    }

    .opt-btn {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.25);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .opt-btn:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
  </style>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
        authDomain: "bca-learning-hub.firebaseapp.com",
        databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bca-learning-hub",
        storageBucket: "bca-learning-hub.firebasestorage.app",
        messagingSenderId: "206989105830",
        appId: "1:206989105830:web:93546fed295efab3017267",
        measurementId: "G-FF3GR0989C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allQuizTopics = {};
    let currentTopicId = null;
    let selectedAnswers = {};
    let currentFilterSem = "All";
    let isAdminLoggedIn = false;

    const synth = window.speechSynthesis;
    let isSpeaking = false;
    let scene, camera, renderer, waveMesh;

    window.onload = function() {
      if (sessionStorage.getItem("bca_admin_auth") === "true") {
        isAdminLoggedIn = true;
        showAdminControls();
      }

      db.ref('bca_structured_quizzes').on('value', (snapshot) => {
        const data = snapshot.val();
        allQuizTopics = data || {};
        renderTopicCards();
      });

      initHologramThreeJS();
    };

    /* Three.js Hologram Background & Audio Reactive Waves */
    function initHologramThreeJS() {
      const canvas = document.getElementById('bg-canvas');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 22);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const geo = new THREE.PlaneGeometry(50, 30, 40, 30);
      const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true, transparent: true, opacity: 0.2 });
      waveMesh = new THREE.Mesh(geo, mat);
      waveMesh.rotation.x = -Math.PI / 2.2;
      waveMesh.position.y = -4;
      scene.add(waveMesh);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animateHologram();
    }

    function animateHologram() {
      requestAnimationFrame(animateHologram);
      const time = Date.now() * 0.002;
      const pos = waveMesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        pos.setZ(i, Math.sin(x * 0.3 + time) * Math.cos(y * 0.3 + time) * 1.5);
      }
      pos.needsUpdate = true;
      renderer.render(scene, camera);
    }

    function showAdminControls() {
      document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
    }

    function renderTopicCards() {
      const container = document.getElementById('topicCardsGrid');
      container.innerHTML = "";
      const keys = Object.keys(allQuizTopics);
      let filteredKeys = currentFilterSem === "All" ? keys : keys.filter(k => allQuizTopics[k].semester === currentFilterSem);

      if (filteredKeys.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 bg-slate-900/50 rounded-2xl border border-cyan-500/20">Is Semester ke liye koi Quiz Topic nahi mila.</div>`;
        return;
      }

      filteredKeys.forEach(key => {
        const item = allQuizTopics[key];
        const qCount = item.questions ? item.questions.length : 0;
        const adminClass = isAdminLoggedIn ? "" : "hidden";

        container.innerHTML += `
          <div class="topic-card rounded-2xl p-5 flex flex-col justify-between relative">
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 text-[10px] font-bold">${item.semester}</span>
                <span class="text-[11px] text-gray-400 font-medium"><i class="fa-solid fa-book-bookmark text-cyan-400 mr-1"></i>${item.chapter}</span>
              </div>
              <h3 class="text-base font-bold text-white mt-2 mb-1">${item.topic}</h3>
              <p class="text-xs text-gray-400 font-medium mb-4">Total Questions: <span class="text-cyan-400 font-bold">${qCount}</span></p>
            </div>
            <div class="flex items-center justify-between pt-3 border-t border-cyan-500/20">
              <div class="flex items-center space-x-2 admin-only ${adminClass}">
                <button onclick="openEditTopicModal('${key}')" class="text-xs text-amber-400 font-bold hover:underline"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                <button onclick="deleteTopic('${key}')" class="text-xs text-rose-500 font-bold hover:underline"><i class="fa-solid fa-trash"></i> Delete</button>
              </div>
              <button onclick="openTopicQuizPage('${key}')" class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs transition flex items-center space-x-1 ml-auto cursor-pointer shadow-lg shadow-cyan-500/30">
                <span>Hologram Quiz</span><i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterBySemester(sem, btn) {
      currentFilterSem = sem;
      document.querySelectorAll('.sem-btn').forEach(b => { b.classList.remove('bg-cyan-500', 'text-slate-950', 'shadow-lg'); b.classList.add('bg-slate-900', 'text-gray-300'); });
      btn.classList.remove('bg-slate-900', 'text-gray-300');
      btn.classList.add('bg-cyan-500', 'text-slate-950', 'shadow-lg');
      renderTopicCards();
    }

    function openTopicQuizPage(topicId) {
      currentTopicId = topicId;
      selectedAnswers = {};
      const topicData = allQuizTopics[topicId];
      if (!topicData) return;

      document.getElementById('portalHome').classList.add('hidden');
      document.getElementById('quizTopicPage').classList.remove('hidden');
      document.getElementById('displaySemBadge').innerText = topicData.semester;
      document.getElementById('displayChapterName').innerText = topicData.chapter;
      document.getElementById('displayTopicTitle').innerText = topicData.topic;

      renderQuestionsList(topicData.questions || []);
    }

    function renderQuestionsList(questions) {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = "";
      const adminClass = isAdminLoggedIn ? "" : "hidden";

      questions.forEach((q, qIdx) => {
        let optionsHtml = "";
        q.options.forEach((opt, oIdx) => {
          optionsHtml += `
            <button id="opt_${qIdx}_${oIdx}" onclick="selectHologramOption(${qIdx}, ${oIdx}, ${q.correct})" class="opt-btn w-full p-3 rounded-xl text-left text-xs font-semibold text-gray-200 flex justify-between items-center">
              <span>${String.fromCharCode(65 + oIdx)}. ${opt}</span>
              <i class="fa-regular fa-circle text-cyan-400/50"></i>
            </button>
          `;
        });

        container.innerHTML += `
          <div class="hologram-screen p-5 rounded-2xl relative">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-cyan-400">Q${qIdx + 1} (Hologram Mode).</span>
              <button onclick="openEditSingleQuestion(${qIdx})" class="admin-only ${adminClass} text-[11px] text-amber-400 font-bold hover:underline"><i class="fa-solid fa-pen mr-1"></i> Edit MCQ</button>
            </div>
            <h4 class="text-sm font-bold text-white mb-3">${q.question}</h4>
            <div class="space-y-2 mb-3">${optionsHtml}</div>
            <div class="flex justify-between items-center pt-2">
              <button onclick="toggleAnswerView(${qIdx}, ${q.correct})" class="text-xs text-amber-400 font-bold hover:underline"><i class="fa-solid fa-eye mr-1"></i> Show Correct Answer</button>
              <span id="ansText_${qIdx}" class="text-xs font-bold text-emerald-400 hidden">Correct: Option ${String.fromCharCode(65 + q.correct)}</span>
            </div>
          </div>
        `;
      });
    }

    /* Holographic Option Selection with Neon Shockwave / Glitch Effect */
    function selectHologramOption(qIdx, oIdx, correctIdx) {
      selectedAnswers[qIdx] = oIdx;
      for (let i = 0; i < 4; i++) {
        let btn = document.getElementById(`opt_${qIdx}_${i}`);
        if (btn) {
          btn.classList.remove('correct-shockwave', 'glitch-anim', 'selected');
        }
      }

      let selectedBtn = document.getElementById(`opt_${qIdx}_${oIdx}`);
      if (oIdx === correctIdx) {
        selectedBtn.classList.add('correct-shockwave');
      } else {
        selectedBtn.classList.add('glitch-anim');
        setTimeout(() => { selectedBtn.classList.remove('glitch-anim'); selectedBtn.classList.add('selected'); }, 400);
      }
    }

    function toggleAnswerView(qIdx, correctIdx) {
      let ansSpan = document.getElementById(`ansText_${qIdx}`);
      let btn = document.getElementById(`opt_${qIdx}_${correctIdx}`);
      if (ansSpan.classList.contains('hidden')) {
        ansSpan.classList.remove('hidden');
        if (btn) btn.classList.add('correct-shockwave');
      } else {
        ansSpan.classList.add('hidden');
        if (btn) btn.classList.remove('correct-shockwave');
      }
    }

    function toggleFullTopicAudio() {
      if (!synth) return;
      if (isSpeaking) { synth.cancel(); isSpeaking = false; document.getElementById('audioBtnText').innerText = "Listen Full Topic Quiz"; return; }
      const topicData = allQuizTopics[currentTopicId];
      if (!topicData || !topicData.questions) return;
      let fullText = `Hologram quiz for ${topicData.topic}. `;
      topicData.questions.forEach((q, idx) => { fullText += `Q ${idx + 1}. ${q.question}. `; });
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(fullText);
      utterance.onend = () => { isSpeaking = false; document.getElementById('audioBtnText').innerText = "Listen Full Topic Quiz"; };
      synth.speak(utterance);
      isSpeaking = true;
      document.getElementById('audioBtnText').innerText = "Stop Audio";
    }

    function submitQuizResult() {
      const topicData = allQuizTopics[currentTopicId];
      if (!topicData || !topicData.questions) return;
      let correct = 0;
      topicData.questions.forEach((q, idx) => { if (selectedAnswers[idx] === q.correct) correct++; });
      let percent = Math.round((correct / topicData.questions.length) * 100);
      document.getElementById('scoreCorrect').innerText = `${correct}/${topicData.questions.length}`;
      document.getElementById('scorePercent').innerText = `${percent}%`;
      document.getElementById('scoreModal').style.display = "flex";
    }

    function backToHomePortal() {
      if (synth) synth.cancel();
      document.getElementById('quizTopicPage').classList.add('hidden');
      document.getElementById('portalHome').classList.remove('hidden');
    }

    function closeScoreModal() { document.getElementById('scoreModal').style.display = "none"; backToHomePortal(); }
    function authenticateAdmin() {
      let pass = prompt("🔑 Enter Admin Password:");
      if (pass === "sagar9955@#") { sessionStorage.setItem("bca_admin_auth", "true"); isAdminLoggedIn = true; showAdminControls(); renderTopicCards(); alert("🎉 Admin Unlocked!"); }
      else if (pass !== null) alert("❌ Wrong Password!");
    }
    function openAdminUploadModal() { if (!isAdminLoggedIn) return authenticateAdmin(); document.getElementById('adminModal').style.display = "flex"; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = "none"; }

    function saveStructuredQuiz(e) {
      e.preventDefault();
      let sem = document.getElementById('uploadSem').value;
      let chapter = document.getElementById('uploadChapter').value.trim();
      let topic = document.getElementById('uploadTopic').value.trim();
      let rawText = document.getElementById('uploadBulkText').value;
      let blocks = rawText.split(/\n\s*\n/);
      let parsedQuestions = [];
      blocks.forEach(block => {
        let lines = block.split('\n').map(l => l.trim()).filter(l => l !== "");
        if (lines.length >= 6) {
          let ansChar = lines[5].replace(/^Ans:\s*/i, '').toUpperCase();
          let correctIdx = {'A':0, 'B':1, 'C':2, 'D':3}[ansChar] || 0;
          parsedQuestions.push({ question: lines[0].replace(/^Q:\s*/i, ''), options: [lines[1].replace(/^A:\s*/i, ''), lines[2].replace(/^B:\s*/i, ''), lines[3].replace(/^C:\s*/i, ''), lines[4].replace(/^D:\s*/i, '')], correct: correctIdx });
        }
      });
      if (parsedQuestions.length === 0) return alert("⚠️ Question format galat hai!");
      db.ref('bca_structured_quizzes').push({ semester: sem, chapter, topic, questions: parsedQuestions, timestamp: new Date().toLocaleString() }).then(() => {
        alert("🎉 Topic Quiz Uploaded Successfully!");
        document.getElementById('uploadQuizForm').reset();
        closeAdminModal();
      });
    }

    function deleteTopic(key) { if (confirm("Delete this topic?")) db.ref(`bca_structured_quizzes/${key}`).remove(); }
    function openEditTopicModal(key) {
      currentTopicId = key;
      const d = allQuizTopics[key];
      document.getElementById('editSem').value = d.semester;
      document.getElementById('editChapter').value = d.chapter;
      document.getElementById('editTopicTitle').value = d.topic;
      document.getElementById('editTopicModal').style.display = "flex";
    }
    function saveEditedTopicHeader(e) {
      e.preventDefault();
      db.ref(`bca_structured_quizzes/${currentTopicId}`).update({ semester: document.getElementById('editSem').value, chapter: document.getElementById('editChapter').value, topic: document.getElementById('editTopicTitle').value }).then(() => {
        alert("Updated!"); document.getElementById('editTopicModal').style.display = "none";
      });
    }
    let editingQuestionIdx = null;
    function openEditSingleQuestion(idx) {
      editingQuestionIdx = idx;
      const q = allQuizTopics[currentTopicId].questions[idx];
      document.getElementById('editQText').value = q.question;
      document.getElementById('editOpt0').value = q.options[0];
      document.getElementById('editOpt1').value = q.options[1];
      document.getElementById('editOpt2').value = q.options[2];
      document.getElementById('editOpt3').value = q.options[3];
      document.getElementById('editCorrectIdx').value = q.correct;
      document.getElementById('editQuestionModal').style.display = "flex";
    }
    function saveSingleQuestionEdit(e) {
      e.preventDefault();
      let d = allQuizTopics[currentTopicId];
      d.questions[editingQuestionIdx] = { question: document.getElementById('editQText').value, options: [document.getElementById('editOpt0').value, document.getElementById('editOpt1').value, document.getElementById('editOpt2').value, document.getElementById('editOpt3').value], correct: parseInt(document.getElementById('editCorrectIdx').value) };
      db.ref(`bca_structured_quizzes/${currentTopicId}/questions`).set(d.questions).then(() => { alert("Updated!"); document.getElementById('editQuestionModal').style.display = "none"; openTopicQuizPage(currentTopicId); });
    }
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

  <canvas id="bg-canvas"></canvas>

  <header class="w-full max-w-6xl py-4 flex justify-between items-center z-10 hologram-screen px-6 rounded-2xl mb-4">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center shadow-lg shadow-cyan-500/30">
        <i class="fa-solid fa-atom text-cyan-400 text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-black text-white tracking-tight" style="font-family: 'Orbitron', sans-serif;">Hologram Quiz Arena</h1>
        <span class="text-xs text-cyan-400 font-medium">Iron Man Sci-Fi Hologram UI</span>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="authenticateAdmin()" class="px-3.5 py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold hover:bg-amber-500/20 transition cursor-pointer"><i class="fa-solid fa-lock mr-1"></i>Admin</button>
      <button onclick="openAdminUploadModal()" class="admin-only hidden px-3.5 py-2 rounded-xl bg-cyan-500 text-slate-950 text-xs font-extrabold hover:bg-cyan-400 transition cursor-pointer"><i class="fa-solid fa-plus mr-1"></i>Add Quiz</button>
      <a href="flashcard.html" class="px-3.5 py-2 rounded-xl bg-purple-900/40 border border-purple-500/30 text-purple-300 text-xs font-bold hover:bg-purple-800 transition">Flashcards</a>
      <a href="index.html" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-gray-300 text-xs font-bold hover:bg-slate-800 transition">Home</a>
    </div>
  </header>

  <main id="portalHome" class="w-full max-w-6xl my-auto py-6 z-10">
    <div class="flex flex-wrap justify-center gap-2 mb-8">
      <button onclick="filterBySemester('All', this)" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-cyan-500 text-slate-950 shadow-lg transition cursor-pointer">All Semesters</button>
      <button onclick="filterBySemester('Semester 1', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-gray-300 border border-cyan-500/30 hover:bg-slate-800 transition cursor-pointer">Sem 1</button>
      <button onclick="filterBySemester('Semester 2', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-gray-300 border border-cyan-500/30 hover:bg-slate-800 transition cursor-pointer">Sem 2</button>
      <button onclick="filterBySemester('Semester 3', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-gray-300 border border-cyan-500/30 hover:bg-slate-800 transition cursor-pointer">Sem 3</button>
      <button onclick="filterBySemester('Semester 4', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-gray-300 border border-cyan-500/30 hover:bg-slate-800 transition cursor-pointer">Sem 4</button>
      <button onclick="filterBySemester('Semester 5', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-gray-300 border border-cyan-500/30 hover:bg-slate-800 transition cursor-pointer">Sem 5</button>
      <button onclick="filterBySemester('Semester 6', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-gray-300 border border-cyan-500/30 hover:bg-slate-800 transition cursor-pointer">Sem 6</button>
    </div>
    <div id="topicCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 px-2"></div>
  </main>

  <section id="quizTopicPage" class="w-full max-w-4xl my-auto hidden z-10 py-6">
    <div class="hologram-screen rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      <div class="flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-cyan-500/30 mb-6">
        <div>
          <button onclick="backToHomePortal()" class="px-3 py-1.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-xs text-cyan-300 font-bold hover:bg-cyan-500/25 transition cursor-pointer mb-2"><i class="fa-solid fa-arrow-left mr-1.5"></i> Back</button>
          <div class="flex items-center space-x-2">
            <span id="displaySemBadge" class="px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 text-[10px] font-bold">Semester 1</span>
            <span id="displayChapterName" class="text-xs text-gray-400 font-semibold">Chapter Name</span>
          </div>
          <h2 id="displayTopicTitle" class="text-2xl font-extrabold text-white mt-1">Topic Title</h2>
        </div>
        <button onclick="toggleFullTopicAudio()" class="px-4 py-2.5 rounded-xl bg-slate-950 border border-cyan-500/40 text-xs font-bold text-cyan-300 hover:bg-slate-800 transition flex items-center shadow cursor-pointer">
          <i id="audioBtnIcon" class="fa-solid fa-volume-high text-cyan-400 mr-2"></i><span id="audioBtnText">Listen Quiz Audio</span>
        </button>
      </div>
      <div id="questionsContainer" class="space-y-6 max-h-[60vh] overflow-y-auto pr-2"></div>
      <div class="mt-8 pt-6 border-t border-cyan-500/30 flex justify-end">
        <button onclick="submitQuizResult()" class="px-8 py-3 bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-extrabold rounded-2xl shadow-lg shadow-cyan-500/40 hover:scale-105 transition cursor-pointer">Submit & Scorecard 🚀</button>
      </div>
    </div>
  </section>

  <!-- ADMIN MODALS & SCORE MODAL -->
  <div id="adminModal" class="modal-overlay"><div class="bg-slate-900 border-2 border-amber-500 rounded-3xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl"><div class="flex justify-between items-center mb-4 pb-3 border-b border-amber-500/30"><h3 class="text-amber-400 font-bold text-sm">Add Topic Quiz</h3><button onclick="closeAdminModal()" class="text-gray-400 hover:text-white text-xs">Close</button></div><form id="uploadQuizForm" onsubmit="saveStructuredQuiz(event)" class="space-y-4 text-xs"><div class="grid grid-cols-3 gap-3"><div><label class="block text-cyan-400 font-bold mb-1">Semester:</label><select id="uploadSem" class="w-full p-2.5 bg-slate-950 border text-white rounded-xl"><option value="Semester 1">Semester 1</option><option value="Semester 2">Semester 2</option><option value="Semester 3">Semester 3</option><option value="Semester 4">Semester 4</option><option value="Semester 5">Semester 5</option><option value="Semester 6">Semester 6</option></select></div><div><label class="block text-cyan-400 font-bold mb-1">Chapter:</label><input type="text" id="uploadChapter" class="w-full p-2.5 bg-slate-950 border text-white rounded-xl" required></div><div><label class="block text-cyan-400 font-bold mb-1">Topic:</label><input type="text" id="uploadTopic" class="w-full p-2.5 bg-slate-950 border text-white rounded-xl" required></div></div><div><label class="block text-cyan-400 font-bold mb-1">Bulk Questions (Format: Q / A / B / C / D / Ans: A):</label><textarea id="uploadBulkText" class="w-full p-3 bg-slate-950 border text-white rounded-xl h-48 font-mono text-[11px]" required></textarea></div><button type="submit" class="w-full py-3 bg-cyan-500 text-slate-950 font-extrabold rounded-xl cursor-pointer">Publish Quiz</button></form></div></div>
  
  <div id="editTopicModal" class="modal-overlay"><div class="bg-slate-900 border-2 border-amber-500 rounded-2xl p-6 max-w-md w-full shadow-2xl"><h3 class="text-amber-400 font-bold text-sm mb-3">Edit Header</h3><form onsubmit="saveEditedTopicHeader(event)" class="space-y-3 text-xs"><div><label class="block text-gray-300 mb-1">Semester:</label><select id="editSem" class="w-full p-2 bg-slate-950 border text-white rounded-lg"><option value="Semester 1">Semester 1</option><option value="Semester 2">Semester 2</option><option value="Semester 3">Semester 3</option></select></div><div><label class="block text-gray-300 mb-1">Chapter:</label><input type="text" id="editChapter" class="w-full p-2 bg-slate-950 border text-white rounded-lg" required></div><div><label class="block text-gray-300 mb-1">Topic:</label><input type="text" id="editTopicTitle" class="w-full p-2 bg-slate-950 border text-white rounded-lg" required></div><button type="submit" class="w-full py-2 bg-amber-500 text-slate-950 font-bold rounded-lg mt-2">Update</button></form></div></div>
  <div id="editQuestionModal" class="modal-overlay"><div class="bg-slate-900 border-2 border-amber-500 rounded-2xl p-6 max-w-md w-full shadow-2xl"><h3 class="text-amber-400 font-bold text-sm mb-3">Edit MCQ</h3><form onsubmit="saveSingleQuestionEdit(event)" class="space-y-3 text-xs"><div><label class="block text-gray-300 mb-1">Question:</label><textarea id="editQText" class="w-full p-2 bg-slate-950 border text-white rounded-lg h-16" required></textarea></div><div class="space-y-1"><input type="text" id="editOpt0" class="w-full p-2 bg-slate-950 border text-white rounded-lg" required><input type="text" id="editOpt1" class="w-full p-2 bg-slate-950 border text-white rounded-lg" required><input type="text" id="editOpt2" class="w-full p-2 bg-slate-950 border text-white rounded-lg" required><input type="text" id="editOpt3" class="w-full p-2 bg-slate-950 border text-white rounded-lg" required></div><div><label class="block text-gray-300 mb-1">Correct Option:</label><select id="editCorrectIdx" class="w-full p-2 bg-slate-950 border text-white rounded-lg"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><button type="submit" class="w-full py-2 bg-amber-500 text-slate-950 font-bold rounded-lg mt-2">Save</button></form></div></div>

  <div id="scoreModal" class="modal-overlay"><div class="bg-slate-900 border-2 border-cyan-500 p-8 max-w-sm w-full text-center rounded-3xl shadow-2xl"><h3 class="text-xl font-black text-white mb-2">Quiz Completed!</h3><div class="grid grid-cols-2 gap-3 mb-6"><div class="bg-slate-950 p-3 rounded-xl"><span class="text-gray-400 text-[10px]">Score</span><span id="scoreCorrect" class="text-xl font-black text-emerald-400 block">0</span></div><div class="bg-slate-950 p-3 rounded-xl"><span class="text-gray-400 text-[10px]">Accuracy</span><span id="scorePercent" class="text-xl font-black text-cyan-400 block">0%</span></div></div><button onclick="closeScoreModal()" class="w-full py-3 bg-cyan-500 text-slate-950 font-black rounded-xl cursor-pointer">Close</button></div></div>

</body>
</html>
