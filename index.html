<!-- Dedicated Quiz Creator Form inside Admin Panel -->
<div class="admin-panel" id="adminQuizPanel">
    <h2>🎯 Admin Custom Quiz Designer</h2>
    <form onsubmit="event.preventDefault(); alert('Quiz question published successfully!');">
        
        <div class="form-group">
            <label>Select Quiz Level Type:</label>
            <select required>
                <option value="topic">Topic-Wise Quiz</option>
                <option value="chapter">Chapter-Wise Quiz</option>
                <option value="boss">🔥 Semester Boss Level Quiz</option>
            </select>
        </div>

        <div class="form-group">
            <label>Select Semester & Chapter:</label>
            <select required>
                <option>Semester 1 - Computer Fundamentals</option>
                <option>Semester 2 - Data Structures</option>
                <option>Semester 3 - DBMS & Java</option>
                <option>Semester 4 - Web Tech</option>
                <option>Semester 5 - Cyber Security</option>
                <option>Semester 6 - AI & Android</option>
            </select>
        </div>

        <div class="form-group">
            <label>Question Text:</label>
            <input type="text" placeholder="Apna Quiz Question likhein..." required>
        </div>

        <div class="form-group">
            <label>Option Details (A, B, C, D):</label>
            <input type="text" placeholder="Option A" required style="margin-bottom: 5px;">
            <input type="text" placeholder="Option B" required style="margin-bottom: 5px;">
            <input type="text" placeholder="Option C" required style="margin-bottom: 5px;">
            <input type="text" placeholder="Option D" required style="margin-bottom: 5px;">
        </div>

        <div class="form-group">
            <label>Select Correct Answer Key:</label>
            <select required>
                <option value="A">Option A</option>
                <option value="B">Option B</option>
                <option value="C">Option C</option>
                <option value="D">Option D</option>
            </select>
        </div>

        <button type="submit" class="btn-publish">🚀 Publish Quiz Question</button>
    </form>
</div>
