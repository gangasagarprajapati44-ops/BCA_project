<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Quiz Arena - Exam Hall Experience</title>

    <!-- Firebase Classic Compatibility Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { 
            background: linear-gradient(rgba(11, 19, 43, 0.85), rgba(3, 7, 30, 0.9)), 
                        url('https://images.unsplash.com/photo-1434030216411-0b793f4b4173?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            min-height: 100vh;
            padding-bottom: 50px;
        }

        nav { 
            background: rgba(11, 19, 43, 0.85); 
            backdrop-filter: blur(15px); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 25px; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(76, 201, 240, 0.2); 
        }
        .logo-area h2 { font-size: 1.2rem; color: #fff; }
        .logo-area span { font-size: 0.7rem; color: #4cc9f0; display: block; }

        .nav-menu { display: flex; gap: 15px; list-style: none; }
        .nav-menu a { color: #cfd9df; text-decoration: none; font-size: 0.9rem; padding: 6px 12px; border-radius: 8px; }
        .nav-menu a:hover { background: rgba(58, 134, 255, 0.3); color: #fff; }

        .quiz-container { max-width: 850px; margin: 100px auto 30px auto; padding: 20px; }

        .quiz-card {
            background: rgba(28, 37, 65, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .quiz-title { color: #ff9800; font-size: 1.5rem; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .quiz-meta { color: #4cc9f0; font-size: 0.85rem; margin-bottom: 20px; }

        .question-item { background: rgba(11, 19, 43, 0.7); padding: 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .question-text { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 12px; }

        .options-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .option-label { 
            display: flex; 
            align-items: center; 
            padding: 10px 15px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            border: 1px solid transparent; 
            font-size: 0.95rem;
        }
        .option-label:hover { background: rgba(58, 134, 255, 0.2); border-color: #3a86ff; }
        .option-label input { margin-right: 12px; }

        .btn-submit-quiz {
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(40,167,69,0.4);
        }

        .result-box {
            display: none;
            background: rgba(28, 37, 65, 0.95);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #4cc9f0;
            text-align: center;
            margin-top: 20px;
        }

        .no-quiz { text-align: center; color: #a5b4fc; font-size: 1.1rem; padding: 40px; }
    </style>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
            authDomain: "bca-learning-hub.firebaseapp.com",
            databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bca-learning-hub",
            storageBucket: "bca-learning-hub.firebasestorage.app",
            messagingSenderId: "206989105830",
            appId: "1:206989105830:web:93546fed295efab3017267",
            measurementId: "G-FF3GR0989C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allQuizzes = [];

        // Fetch Quizzes from Firebase on Page Load
        window.onload = function() {
            const quizContainer = document.getElementById("quizContent");

            db.ref('bca_quizzes').on('value', (snapshot) => {
                quizContainer.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    quizContainer.innerHTML = '<div class="no-quiz">⏳ Abhi koi quiz uploaded nahi hai. Admin panel se quiz publish karein!</div>';
                    return;
                }

                allQuizzes = Object.values(data);
                
                allQuizzes.forEach((quizSet, quizIndex) => {
                    let quizHtml = `
                        <div class="quiz-card">
                            <h2 class="quiz-title">🎯 ${quizSet.topic || "BCA Practice Quiz"}</h2>
                            <div class="quiz-meta">📚 ${quizSet.semester || "Semester All"} | 🕒 Posted: ${quizSet.timestamp || 'Recently'}</div>
                            <form id="quizForm_${quizIndex}">
                    `;

                    quizSet.questions.forEach((q, qIndex) => {
                        quizHtml += `
                            <div class="question-item">
                                <div class="question-text">Q${qIndex + 1}. ${q.question}</div>
                                <div class="options-list">
                                    <label class="option-label"><input type="radio" name="q_${quizIndex}_${qIndex}" value="A"> A) ${q.options[0]}</label>
                                    <label class="option-label"><input type="radio" name="q_${quizIndex}_${qIndex}" value="B"> B) ${q.options[1]}</label>
                                    <label class="option-label"><input type="radio" name="q_${quizIndex}_${qIndex}" value="C"> C) ${q.options[2]}</label>
                                    <label class="option-label"><input type="radio" name="q_${quizIndex}_${qIndex}" value="D"> D) ${q.options[3]}</label>
                                </div>
                            </div>
                        `;
                    });

                    quizHtml += `
                                <button type="button" class="btn-submit-quiz" onclick="checkQuizAnswers(${quizIndex})">✅ Submit Exam Answers</button>
                            </form>
                            <div class="result-box" id="result_${quizIndex}"></div>
                        </div>
                    `;

                    quizContainer.innerHTML += quizHtml;
                });
            });
        };

        function checkQuizAnswers(quizIndex) {
            const quizSet = allQuizzes[quizIndex];
            let score = 0;
            let total = quizSet.questions.length;

            quizSet.questions.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="q_${quizIndex}_${qIndex}"]:checked`);
                if (selected && selected.value === q.correct) {
                    score++;
                }
            });

            const resultDiv = document.getElementById(`result_${quizIndex}`);
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3 style="color: #4cc9f0;">🎉 Exam Result</h3>
                <p style="font-size: 1.2rem; margin: 10px 0;">Aapka Score: <strong>${score} / ${total}</strong></p>
                <p style="color: #a5b4fc;">Percentage: <strong>${((score/total)*100).toFixed(1)}%</strong></p>
            `;
            window.scrollTo({ top: resultDiv.offsetTop - 100, behavior: 'smooth' });
        }
    </script>
</head>
<body>

    <nav>
        <div class="logo-area">
            <h2>🎓 BCA Learning Hub</h2>
            <span>3D Immersive Education</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html" style="color: #4cc9f0; font-weight: bold;">⚡ Quiz Arena</a></li>
            <li><a href="template.html">Topic Viewer</a></li>
        </ul>
    </nav>

    <div class="quiz-container">
        <h1 style="text-align: center; margin-bottom: 25px; color: #4cc9f0;">⚡ Online Examination Hall</h1>
        <div id="quizContent">
            <div class="no-quiz">⏳ Loading Quizzes from Cloud Database...</div>
        </div>
    </div>

</body>
</html>
