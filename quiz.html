<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Learning Hub - Smart 3D Quiz Platform</title>
  
  <!-- Tailwind CSS for utility styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Cyber Matrix Background */
    .matrix-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.12) 0%, rgba(2, 6, 23, 0.98) 80%),
        linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 50px 50px, 50px 50px;
    }

    /* 3D Perspective Wrapper */
    .quiz-container {
      perspective: 1000px;
    }

    /* 3D Card Glassmorphism Effect */
    .card-3d {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.25);
      box-shadow: 
        0 35px 70px -15px rgba(0, 0, 0, 0.98),
        0 0 60px rgba(6, 182, 212, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.2);
      transform-style: preserve-3d;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card-3d:hover {
      transform: translateY(-3px) rotateX(1deg) rotateY(-1deg);
      box-shadow: 
        0 35px 70px rgba(6, 182, 212, 0.3),
        inset 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    /* 3D Option Buttons */
    .btn-option-3d {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(6, 182, 212, 0.2);
      box-shadow: 0 6px 0 #020617, 0 10px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.15s ease-in-out;
    }

    .btn-option-3d:hover {
      background: linear-gradient(145deg, #334155, #1e293b);
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #020617, 0 12px 20px rgba(6, 182, 212, 0.2);
    }

    .btn-option-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #020617, 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    /* Selected Option Glow */
    .btn-option-3d.selected {
      background: linear-gradient(135deg, #0891b2, #3b82f6);
      box-shadow: 0 6px 0 #1e3a8a, 0 0 20px rgba(6, 182, 212, 0.5);
      border-color: #38bdf8;
    }

    /* 3D Cyan Action Button */
    .btn-action-3d {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      box-shadow: 0 6px 0 #1e40af, 0 10px 20px rgba(6, 182, 212, 0.4);
    }
    .btn-action-3d:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #1e40af, 0 15px 25px rgba(6, 182, 212, 0.6);
    }
    .btn-action-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e40af, 0 5px 10px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="matrix-bg flex flex-col justify-between items-center p-4 min-h-screen">

  <!-- Top Navigation Header -->
  <header class="w-full max-w-3xl px-2 py-4 flex justify-between items-center z-10">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/30">
        <i class="fa-solid fa-brain text-white text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-cyan-200 to-cyan-400">
          BCA Smart Quiz
        </h1>
        <span class="text-xs text-cyan-400 font-medium">Interactive Learning Module</span>
      </div>
    </div>

    <!-- Home Navigation Button -->
    <a href="index.html" class="px-3 py-1.5 rounded-lg bg-gray-900 border border-cyan-500/30 text-gray-300 text-xs font-semibold hover:bg-gray-800 transition flex items-center space-x-2">
      <i class="fa-solid fa-house text-cyan-400"></i>
      <span>Home</span>
    </a>
  </header>

  <!-- Main Quiz Container -->
  <main class="quiz-container w-full max-w-3xl my-auto">
    
    <!-- 3D Card -->
    <div class="card-3d rounded-3xl p-6 sm:p-10 text-white relative overflow-hidden">
      
      <!-- Top Bar: Timer, Lifelines & Progress -->
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <!-- Progress Pills -->
        <div class="flex items-center space-x-2">
          <span class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-3 py-1 rounded-full text-xs font-semibold tracking-wider">
            <i class="fa-solid fa-layer-group mr-1"></i> Question <span id="current-num">1</span>/<span id="total-num">5</span>
          </span>
          <span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 px-3 py-1 rounded-full text-xs font-semibold">
            <i class="fa-solid fa-coins mr-1 text-yellow-400"></i> +10 XP
          </span>
        </div>

        <!-- Timer -->
        <div class="flex items-center space-x-2 bg-slate-900/80 px-4 py-1.5 rounded-full border border-cyan-500/30">
          <i class="fa-solid fa-stopwatch text-cyan-400 animate-pulse"></i>
          <span id="timer" class="font-mono text-lg font-bold text-cyan-300">15s</span>
        </div>
      </div>

      <!-- Smooth Progress Bar -->
      <div class="w-full bg-slate-900/80 h-2.5 rounded-full mb-8 overflow-hidden border border-cyan-500/20">
        <div id="progress-bar" class="bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500 h-full w-1/5 transition-all duration-300 rounded-full"></div>
      </div>

      <!-- Question Text -->
      <div class="mb-8">
        <h2 id="question-text" class="text-xl sm:text-2xl font-bold leading-relaxed tracking-wide text-slate-100">
          Question yahan load hoga...
        </h2>
      </div>

      <!-- Options List -->
      <div id="options-container" class="grid grid-cols-1 gap-4 mb-8">
        <!-- Dynamic Options JavaScript se aayenge -->
      </div>

      <!-- Bottom Bar: Features & Next Button -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-cyan-900/50">
        <!-- Lifeline / Hint Buttons -->
        <div class="flex space-x-3">
          <button onclick="useHint()" title="Hint lein" class="bg-slate-900 hover:bg-slate-800 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs font-medium text-amber-300 transition-all flex items-center">
            <i class="fa-solid fa-lightbulb mr-1.5 text-amber-400"></i> 50:50
          </button>
          <button onclick="aiExplain()" title="AI Explanation" class="bg-slate-900 hover:bg-slate-800 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs font-medium text-cyan-300 transition-all flex items-center">
            <i class="fa-solid fa-wand-magic-sparkles mr-1.5 text-cyan-400"></i> AI Hint
          </button>
        </div>

        <!-- Submit / Next Button -->
        <button id="next-btn" onclick="nextQuestion()" class="btn-action-3d w-full sm:w-auto px-8 py-3 rounded-2xl font-bold tracking-wide text-white flex items-center justify-center space-x-2">
          <span>Aage Badhein</span>
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
      </div>

    </div>
  </main>

  <!-- Footer Info -->
  <footer class="w-full max-w-7xl px-6 py-4 text-center text-xs text-cyan-500/60 z-10">
    © 2026 BCA Learning Hub | Interactive Quiz Module
  </footer>

  <!-- JavaScript Logic -->
  <script>
    // Sample Questions Data related to BCA & Web Tech
    const quizData = [
      {
        question: "1. Web development me styling ke liye sabse popular CSS framework me se ek kaun sa hai?",
        options: ["Python", "Tailwind CSS", "C++", "MySQL"],
        correct: 1
      },
      {
        question: "2. JavaScript ka upayog mukhya roop se kis kaam ke liye hota hai?",
        options: ["Database manage karne", "Page me Interactivity add karne", "Graphics Card design karne", "Operating System banane"],
        correct: 1
      },
      {
        question: "3. HTML ka pura naam (Full Form) kya hai?",
        options: ["Hyper Text Markup Language", "High Tech Multi Language", "Hyper Transfer Machine Language", "Home Tool Markup Language"],
        correct: 0
      },
      {
        question: "4. Database se data query karne ke liye kis bhasha ka upayog kiya jata hai?",
        options: ["HTML", "CSS", "SQL", "XML"],
        correct: 2
      },
      {
        question: "5. Inme se kaun sa ek Programming Language nahi hai?",
        options: ["Java", "Python", "HTML", "C++"],
        correct: 2
      }
    ];

    let currentIdx = 0;
    let selectedOption = null;

    document.getElementById('total-num').innerText = quizData.length;

    function loadQuestion() {
      const q = quizData[currentIdx];
      document.getElementById('current-num').innerText = currentIdx + 1;
      document.getElementById('question-text').innerText = q.question;
      
      // Update Progress Bar
      const progressPercent = ((currentIdx + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = progressPercent + '%';

      // Load Options
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option-3d text-left p-4 rounded-2xl font-medium text-slate-200 flex items-center justify-between w-full';
        btn.innerHTML = `
          <span class="flex items-center">
            <span class="w-8 h-8 rounded-xl bg-slate-900 border border-cyan-500/30 flex items-center justify-center text-xs text-cyan-400 font-bold mr-3">${String.fromCharCode(65 + index)}</span>
            ${opt}
          </span>
          <i class="fa-regular fa-circle check-icon text-slate-500"></i>
        `;
        btn.onclick = () => selectOption(btn, index);
        container.appendChild(btn);
      });
    }

    function selectOption(element, index) {
      selectedOption = index;
      const allButtons = document.querySelectorAll('.btn-option-3d');
      allButtons.forEach(btn => {
        btn.classList.remove('selected');
        btn.querySelector('.check-icon').className = 'fa-regular fa-circle check-icon text-slate-500';
      });

      element.classList.add('selected');
      element.querySelector('.check-icon').className = 'fa-solid fa-circle-check check-icon text-cyan-300';
    }

    function nextQuestion() {
      if (selectedOption === null) {
        alert("Kripya pehle ek uttar chunein!");
        return;
      }
      
      if (currentIdx < quizData.length - 1) {
        currentIdx++;
        selectedOption = null;
        loadQuestion();
      } else {
        alert("Quiz Poora Ho Gaya! Shaandar Kaam 🎉");
        currentIdx = 0;
        selectedOption = null;
        loadQuestion();
      }
    }

    function useHint() {
      alert("50:50 Lifeline: Do galat vikalp hata diye gaye hain!");
    }

    function aiExplain() {
      alert("🤖 AI Smart Explanation: Apne chune hue vikalp ko dhyaan se dekhein, yeh BCA syllabus se juda mukhy vishay hai.");
    }

    // Initial Load
    loadQuestion();
  </script>
</body>
</html>
