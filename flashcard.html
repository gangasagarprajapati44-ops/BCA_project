<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Learning Hub - 3D Digital Flashcard Hub</title>

  <!-- Firebase Classic Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@700&family=Pacifico&family=VT323&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Cyber Matrix Background */
    .matrix-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.12) 0%, rgba(2, 6, 23, 0.98) 80%),
        linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 50px 50px, 50px 50px;
    }

    /* 3D Perspective Flip Effect */
    .perspective-1000 {
      perspective: 1000px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
    }

    .card-front {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(168, 85, 247, 0.15);
    }

    .card-back {
      background: rgba(24, 16, 43, 0.96);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(236, 72, 153, 0.5);
      transform: rotateY(180deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(236, 72, 153, 0.2);
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #7e22ce; border-radius: 4px; }
  </style>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
        authDomain: "bca-learning-hub.firebaseapp.com",
        databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bca-learning-hub",
        storageBucket: "bca-learning-hub.firebasestorage.app",
        messagingSenderId: "206989105830",
        appId: "1:206989105830:web:93546fed295efab3017267",
        measurementId: "G-FF3GR0989C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allFlashcards = [];
    let currentFilter = "All";
    let searchQuery = "";
    
    // Web Speech API Synthesis Engine
    const synth = window.speechSynthesis;

    window.onload = function() {
      db.ref('bca_flashcards').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          allFlashcards = Object.entries(data).map(([id, val]) => ({ id, ...val }));
        } else {
          allFlashcards = getSampleCards();
        }
        renderCards();
      });
    };

    function getSampleCards() {
      return [
        {
          id: "sample_1",
          semester: "Semester 1",
          topic: "C Programming",
          question: "What is a Pointer in C language?",
          answer: "A pointer is a variable that stores the memory address of another variable.",
          qFont: "'Inter', sans-serif",
          qColor: "#f8fafc",
          aFont: "'Inter', sans-serif",
          aColor: "#38bdf8",
          badgeColor: "#8b5cf6",
          borderColor: "#06b6d4"
        },
        {
          id: "sample_2",
          semester: "Semester 1",
          topic: "Computer Fundamentals",
          question: "Difference between RAM and ROM?",
          answer: "RAM is volatile memory used for temporary execution, whereas ROM is non-volatile memory storing permanent system boot data.",
          qFont: "'Orbitron', sans-serif",
          qColor: "#38bdf8",
          aFont: "'Inter', sans-serif",
          aColor: "#f1f5f9",
          badgeColor: "#ec4899",
          borderColor: "#ec4899"
        },
        {
          id: "sample_3",
          semester: "Semester 2",
          topic: "Data Structures",
          question: "What principle does a Stack data structure follow?",
          answer: "A Stack follows the Last In, First Out (LIFO) principle, where the element inserted last is removed first.",
          qFont: "'Cinzel', serif",
          qColor: "#fbbf24",
          aFont: "'Inter', sans-serif",
          aColor: "#34d399",
          badgeColor: "#10b981",
          borderColor: "#f59e0b"
        }
      ];
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = "";

      let filtered = allFlashcards;

      if (currentFilter !== "All") {
        filtered = filtered.filter(c => c.semester === currentFilter);
      }

      if (searchQuery.trim() !== "") {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(c => 
          c.topic.toLowerCase().includes(q) || 
          c.question.toLowerCase().includes(q) || 
          c.answer.toLowerCase().includes(q)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-950/60 rounded-3xl border border-purple-500/20">
            <i class="fa-solid fa-layer-group text-4xl text-purple-400 mb-3 block opacity-50"></i>
            <p class="text-sm font-semibold text-gray-400">No flashcards found matching your filter criteria.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((card) => {
        const qFont = card.qFont || "'Inter', sans-serif";
        const qColor = card.qColor || "#ffffff";
        const aFont = card.aFont || "'Inter', sans-serif";
        const aColor = card.aColor || "#38bdf8";
        const badgeColor = card.badgeColor || "#8b5cf6";
        const borderColor = card.borderColor || "rgba(168, 85, 247, 0.4)";

        container.innerHTML += `
          <div class="card-container perspective-1000 h-80 cursor-pointer" onclick="flipCard(this, event)">
            <div class="card-inner">
              
              <!-- FRONT FACE -->
              <div class="card-front" style="border-color: ${borderColor}; shadow-color: ${borderColor}55;">
                <div>
                  <div class="flex justify-between items-center mb-3">
                    <span class="px-3 py-1 rounded-full text-[11px] font-bold text-white shadow-sm" style="background-color: ${badgeColor};">
                      ${card.semester}
                    </span>
                    <span class="text-xs text-purple-300 font-semibold tracking-wide">
                      <i class="fa-solid fa-bookmark mr-1 text-purple-400"></i>${card.topic || 'General'}
                    </span>
                  </div>
                  
                  <div class="mt-3">
                    <span class="text-[10px] uppercase font-bold tracking-wider text-purple-400 block mb-1">Question:</span>
                    <h3 class="text-base font-extrabold leading-snug" style="font-family: ${qFont}; color: ${qColor};">
                      ${card.question}
                    </h3>
                  </div>
                </div>

                <div class="flex items-center justify-between pt-3 border-t border-purple-500/20">
                  <button type="button" onclick="speakText('${escapeQuotes(card.question)}', event)" class="px-3 py-1.5 rounded-lg bg-purple-500/20 border border-purple-500/40 text-purple-300 text-xs font-bold hover:bg-purple-500/40 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-volume-high text-xs"></i>
                    <span>Listen</span>
                  </button>
                  <span class="text-xs text-purple-400 font-semibold flex items-center">
                    Tap to Flip <i class="fa-solid fa-rotate text-xs ml-1.5 animate-pulse"></i>
                  </span>
                </div>
              </div>

              <!-- BACK FACE -->
              <div class="card-back" style="border-color: ${borderColor};">
                <div>
                  <div class="flex justify-between items-center mb-2 pb-2 border-b border-pink-500/20">
                    <span class="text-[10px] uppercase tracking-wider text-pink-400 font-bold flex items-center">
                      <i class="fa-solid fa-circle-check mr-1.5 text-emerald-400"></i>Answer / Concept
                    </span>
                    <span class="text-[10px] text-gray-400">${card.topic}</span>
                  </div>
                  <p class="text-xs sm:text-sm leading-relaxed mt-2" style="font-family: ${aFont}; color: ${aColor};">
                    ${card.answer}
                  </p>
                </div>

                <div class="flex items-center justify-between pt-3 border-t border-pink-500/20">
                  <button type="button" onclick="speakText('${escapeQuotes(card.answer)}', event)" class="px-3 py-1.5 rounded-lg bg-pink-500/20 border border-pink-500/40 text-pink-300 text-xs font-bold hover:bg-pink-500/40 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-volume-high text-xs"></i>
                    <span>Listen Answer</span>
                  </button>
                  <span class="text-xs text-pink-400 font-semibold flex items-center">
                    <i class="fa-solid fa-arrow-left text-xs mr-1.5"></i> Flip Back
                  </span>
                </div>
              </div>

            </div>
          </div>
        `;
      });
    }

    function flipCard(cardEl, event) {
      if (event.target.closest('button')) return; // Prevent flip when clicking voice button
      cardEl.classList.toggle('flipped');
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function speakText(text, event) {
      event.stopPropagation();
      if (!synth) return alert("Speech synthesis not supported in this browser.");
      
      synth.cancel(); // Stop current speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      synth.speak(utterance);
    }

    function filterSem(sem, btn) {
      currentFilter = sem;
      document.querySelectorAll('.sem-btn').forEach(b => {
        b.classList.remove('bg-purple-600', 'text-white', 'shadow-lg', 'shadow-purple-600/40');
        b.classList.add('bg-slate-900', 'text-gray-300', 'border', 'border-purple-500/30');
      });
      btn.classList.remove('bg-slate-900', 'text-gray-300', 'border', 'border-purple-500/30');
      btn.classList.add('bg-purple-600', 'text-white', 'shadow-lg', 'shadow-purple-600/40');
      renderCards();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderCards();
    }

    function openAdminModal() {
      let pass = prompt("🔑 Enter Admin Password:");
      if (pass === "sagar9955@#") {
        document.getElementById('adminModal').style.display = "flex";
      } else if (pass !== null) {
        alert("❌ Access Denied! Wrong Password.");
      }
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = "none";
    }

    function saveFlashcard(e) {
      e.preventDefault();
      const newCard = {
        semester: document.getElementById('cardSem').value,
        topic: document.getElementById('cardTopic').value,
        question: document.getElementById('cardQ').value,
        answer: document.getElementById('cardA').value,
        qFont: document.getElementById('cardQFont').value,
        qColor: document.getElementById('cardQColor').value,
        aFont: document.getElementById('cardAFont').value,
        aColor: document.getElementById('cardAColor').value,
        badgeColor: document.getElementById('cardBadgeColor').value,
        borderColor: document.getElementById('cardBorderColor').value,
        timestamp: new Date().toLocaleString()
      };

      db.ref('bca_flashcards').push(newCard).then(() => {
        alert("🎉 New Flashcard Published Successfully!");
        document.getElementById('flashcardForm').reset();
        closeAdminModal();
      });
    }
  </script>
</head>
<body class="matrix-bg min-h-screen flex flex-col justify-between items-center p-4">

  <!-- Header -->
  <header class="w-full max-w-7xl py-4 px-2 flex justify-between items-center z-10">
    <div class="flex items-center space-x-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
        <i class="fa-solid fa-layer-group text-white text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-black tracking-tight text-white">BCA 3D Flashcard Hub</h1>
        <span class="text-xs text-purple-400 font-medium">Smart Interactive Revision Platform</span>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="flex items-center space-x-3">
      <button onclick="openAdminModal()" class="px-3.5 py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold hover:bg-amber-500/20 transition flex items-center space-x-2 cursor-pointer shadow">
        <i class="fa-solid fa-lock text-amber-400"></i>
        <span>Admin Panel</span>
      </button>
      <a href="quiz.html" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-purple-500/30 text-gray-300 text-xs font-bold hover:bg-slate-800 transition flex items-center space-x-1.5">
        <i class="fa-solid fa-bolt text-amber-400"></i>
        <span>Quiz</span>
      </a>
      <a href="template.html" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-purple-500/30 text-gray-300 text-xs font-bold hover:bg-slate-800 transition flex items-center space-x-1.5">
        <i class="fa-solid fa-book-open text-emerald-400"></i>
        <span>Topics</span>
      </a>
      <a href="index.html" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-purple-500/30 text-gray-300 text-xs font-bold hover:bg-slate-800 transition flex items-center space-x-1.5">
        <i class="fa-solid fa-house text-purple-400"></i>
        <span>Home</span>
      </a>
    </div>
  </header>

  <!-- Main Section -->
  <main class="w-full max-w-7xl my-auto py-6 z-10 px-2">
    
    <!-- Controls Bar: Search & Semester Filters -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
      
      <!-- Search Bar -->
      <div class="relative w-full md:w-80">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-purple-400">
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </div>
        <input 
          type="text" 
          oninput="handleSearch(this.value)"
          placeholder="Search topic, question, or term..." 
          class="w-full bg-slate-950/90 border border-purple-500/30 rounded-2xl py-2.5 pl-9 pr-4 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition shadow-inner"
        >
      </div>

      <!-- Semester Buttons -->
      <div class="flex flex-wrap justify-center gap-2">
        <button onclick="filterSem('All', this)" class="sem-btn px-4 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white shadow-lg shadow-purple-600/40 transition cursor-pointer">All Semesters</button>
        <button onclick="filterSem('Semester 1', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 1</button>
        <button onclick="filterSem('Semester 2', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 2</button>
        <button onclick="filterSem('Semester 3', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 3</button>
        <button onclick="filterSem('Semester 4', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 4</button>
        <button onclick="filterSem('Semester 5', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 5</button>
        <button onclick="filterSem('Semester 6', this)" class="sem-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-purple-500/30 text-gray-300 hover:bg-purple-900/40 transition cursor-pointer">Sem 6</button>
      </div>

    </div>

    <!-- Cards Grid Container -->
    <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic 3D Flashcards Rendered Here -->
    </div>

  </main>

  <!-- Admin Modal with Full Color & Typography Customization -->
  <div id="adminModal" class="modal-overlay">
    <div class="bg-slate-900 border-2 border-amber-500 rounded-3xl p-6 max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-amber-500/30">
        <h3 class="text-amber-400 font-extrabold text-sm flex items-center">
          <i class="fa-solid fa-sliders mr-2"></i>Admin Flashcard Studio
        </h3>
        <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white font-bold text-xs cursor-pointer">❌ Close</button>
      </div>

      <form id="flashcardForm" onsubmit="saveFlashcard(event)" class="space-y-4 text-xs">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-purple-400 font-bold mb-1">Select Semester:</label>
            <select id="cardSem" class="w-full p-2.5 bg-slate-950 border border-purple-500/30 text-white rounded-xl" required>
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4">Semester 4</option>
              <option value="Semester 5">Semester 5</option>
              <option value="Semester 6">Semester 6</option>
            </select>
          </div>
          <div>
            <label class="block text-purple-400 font-bold mb-1">Topic / Subject Title:</label>
            <input type="text" id="cardTopic" placeholder="e.g. Operating System" class="w-full p-2.5 bg-slate-950 border border-purple-500/30 text-white rounded-xl" required>
          </div>
        </div>

        <!-- Front Question Styling Options -->
        <div class="bg-slate-950 p-3.5 rounded-2xl border border-purple-500/20 space-y-2">
          <label class="block text-purple-300 font-bold">Front Question & Styling:</label>
          <textarea id="cardQ" placeholder="Enter Question text..." class="w-full p-2.5 bg-slate-900 border border-purple-500/30 text-white rounded-xl h-16" required></textarea>
          
          <div class="grid grid-cols-2 gap-3 pt-1">
            <div>
              <label class="block text-[10px] text-gray-400 mb-1">Question Font:</label>
              <select id="cardQFont" class="w-full p-2 bg-slate-900 border border-purple-500/30 text-white rounded-lg text-[11px]">
                <option value="'Inter', sans-serif">Inter (Default)</option>
                <option value="'Orbitron', sans-serif">Orbitron (Cyber)</option>
                <option value="'Cinzel', serif">Cinzel (Classic)</option>
                <option value="'Pacifico', cursive">Pacifico (Script)</option>
                <option value="'VT323', monospace">VT323 (Retro Terminal)</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] text-gray-400 mb-1">Question Color:</label>
              <input type="color" id="cardQColor" value="#ffffff" class="w-full h-8 bg-slate-900 border border-purple-500/30 rounded-lg cursor-pointer">
            </div>
          </div>
        </div>

        <!-- Back Answer Styling Options -->
        <div class="bg-slate-950 p-3.5 rounded-2xl border border-pink-500/20 space-y-2">
          <label class="block text-pink-300 font-bold">Back Answer & Styling:</label>
          <textarea id="cardA" placeholder="Enter Answer explanation..." class="w-full p-2.5 bg-slate-900 border border-pink-500/30 text-white rounded-xl h-20" required></textarea>
          
          <div class="grid grid-cols-2 gap-3 pt-1">
            <div>
              <label class="block text-[10px] text-gray-400 mb-1">Answer Font:</label>
              <select id="cardAFont" class="w-full p-2 bg-slate-900 border border-pink-500/30 text-white rounded-lg text-[11px]">
                <option value="'Inter', sans-serif">Inter (Default)</option>
                <option value="'Orbitron', sans-serif">Orbitron (Cyber)</option>
                <option value="'Cinzel', serif">Cinzel (Classic)</option>
                <option value="'Pacifico', cursive">Pacifico (Script)</option>
                <option value="'VT323', monospace">VT323 (Retro Terminal)</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] text-gray-400 mb-1">Answer Color:</label>
              <input type="color" id="cardAColor" value="#38bdf8" class="w-full h-8 bg-slate-900 border border-pink-500/30 rounded-lg cursor-pointer">
            </div>
          </div>
        </div>

        <!-- Card Colors Setup -->
        <div class="grid grid-cols-2 gap-3 bg-slate-950 p-3 rounded-2xl border border-amber-500/20">
          <div>
            <label class="block text-[10px] text-amber-400 font-bold mb-1">Topic Badge Color:</label>
            <input type="color" id="cardBadgeColor" value="#8b5cf6" class="w-full h-8 bg-slate-900 border border-amber-500/30 rounded-lg cursor-pointer">
          </div>
          <div>
            <label class="block text-[10px] text-amber-400 font-bold mb-1">Card Border Glow Color:</label>
            <input type="color" id="cardBorderColor" value="#a855f7" class="w-full h-8 bg-slate-900 border border-amber-500/30 rounded-lg cursor-pointer">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-extrabold rounded-xl transition shadow-lg shadow-purple-600/30 cursor-pointer">
          🚀 Publish Flashcard
        </button>

      </form>

    </div>
  </div>

  <!-- Footer -->
  <footer class="w-full max-w-7xl py-4 text-center text-xs text-purple-400/60 z-10">
    © 2026 BCA Learning Hub | Interactive 3D Digital Flashcard Studio
  </footer>

</body>
</html>
