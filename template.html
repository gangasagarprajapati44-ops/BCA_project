<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Topic Viewer - Cloud Synced Content</title>

    <!-- Firebase Classic Compatibility Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { 
            background: linear-gradient(rgba(11, 19, 43, 0.85), rgba(3, 7, 30, 0.9)), 
                        url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            min-height: 100vh;
            padding-bottom: 50px;
        }

        nav { 
            background: rgba(11, 19, 43, 0.85); 
            backdrop-filter: blur(15px); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 25px; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(76, 201, 240, 0.2); 
        }
        .logo-area h2 { font-size: 1.2rem; color: #fff; }
        .logo-area span { font-size: 0.7rem; color: #4cc9f0; display: block; }

        .nav-menu { display: flex; gap: 15px; list-style: none; }
        .nav-menu a { color: #cfd9df; text-decoration: none; font-size: 0.9rem; padding: 6px 12px; border-radius: 8px; }
        .nav-menu a:hover { background: rgba(58, 134, 255, 0.3); color: #fff; }

        .content-container { max-width: 900px; margin: 100px auto 30px auto; padding: 20px; }

        .topic-card {
            background: rgba(28, 37, 65, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .topic-title { color: #4cc9f0; font-size: 1.8rem; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .topic-meta { color: #ff9800; font-size: 0.9rem; margin-bottom: 20px; font-weight: bold; }
        
        .section-box { background: rgba(11, 19, 43, 0.7); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .section-box h3 { color: #3a86ff; margin-bottom: 10px; font-size: 1.1rem; }
        .section-box p, .section-box pre { color: #e2e8f0; font-size: 0.95rem; white-space: pre-wrap; line-height: 1.6; }

        .model-badge { display: inline-block; background: rgba(76, 201, 240, 0.2); color: #4cc9f0; padding: 6px 12px; border-radius: 6px; margin: 4px; font-size: 0.85rem; border: 1px solid rgba(76,201,240,0.4); }

        .no-content { text-align: center; color: #a5b4fc; font-size: 1.1rem; padding: 50px; }
    </style>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
            authDomain: "bca-learning-hub.firebaseapp.com",
            databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bca-learning-hub",
            storageBucket: "bca-learning-hub.firebasestorage.app",
            messagingSenderId: "206989105830",
            appId: "1:206989105830:web:93546fed295efab3017267",
            measurementId: "G-FF3GR0989C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = function() {
            const container = document.getElementById("dynamicTopics");

            db.ref('bca_topics').on('value', (snapshot) => {
                container.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = '<div class="no-content">⏳ Abhi koi topic uploaded nahi hai. Admin panel se content publish karein!</div>';
                    return;
                }

                const topicsArray = Object.values(data).reverse(); // Latest topic sabse upar dikhega

                topicsArray.forEach((item) => {
                    let modelsHtml = "";
                    if (item.models && item.models.length > 0) {
                        item.models.forEach(m => {
                            modelsHtml += `<span class="model-badge">📦 3D Model: ${m}</span>`;
                        });
                    }

                    let cardHtml = `
                        <div class="topic-card">
                            <h2 class="topic-title">${item.title}</h2>
                            <div class="topic-meta">🎓 ${item.semester} &nbsp;|&nbsp; 🕒 ${item.timestamp || 'Recent'}</div>

                            <div class="section-box">
                                <h3>📖 Definition & Real-World Example</h3>
                                <p>${item.definition}</p>
                            </div>

                            ${item.qa ? `
                            <div class="section-box">
                                <h3>❓ Important Q&A Box</h3>
                                <pre>${item.qa}</pre>
                            </div>` : ''}

                            ${modelsHtml ? `
                            <div class="section-box">
                                <h3>🧊 Attached 3D Models</h3>
                                <div>${modelsHtml}</div>
                            </div>` : ''}

                            ${item.lab ? `
                            <div class="section-box">
                                <h3>💻 Practical Lab Activity & Code</h3>
                                <pre>${item.lab}</pre>
                            </div>` : ''}
                        </div>
                    `;

                    container.innerHTML += cardHtml;
                });
            });
        };
    </script>
</head>
<body>

    <nav>
        <div class="logo-area">
            <h2>🎓 BCA Learning Hub</h2>
            <span>3D Immersive Education</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html">⚡ Quiz Arena</a></li>
            <li><a href="template.html" style="color: #4cc9f0; font-weight: bold;">Topic Viewer</a></li>
        </ul>
    </nav>

    <div class="content-container">
        <h1 style="text-align: center; margin-bottom: 25px; color: #4cc9f0;">📚 Cloud Synced BCA Study Materials</h1>
        <div id="dynamicTopics">
            <div class="no-content">⏳ Loading Topics from Cloud Database...</div>
        </div>
    </div>

</body>
</html>
