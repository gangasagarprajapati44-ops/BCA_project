<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Learning Hub - 3D Interactive Platform</title>

  <!-- Firebase Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .matrix-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(124, 58, 237, 0.15) 0%, rgba(2, 6, 23, 0.98) 80%),
        linear-gradient(rgba(124, 58, 237, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 50px 50px, 50px 50px;
    }

    /* Reliable 3D Glowing Orb Visual Element */
    .orb-3d-container {
      width: 180px;
      height: 180px;
      margin: 0 auto 1.5rem auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orb-core {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #a855f7, #6366f1, #090d16);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.4);
      animation: floatOrb 4s ease-in-out infinite alternate;
    }

    .orb-ring {
      position: absolute;
      width: 170px;
      height: 60px;
      border: 3px solid rgba(168, 85, 247, 0.6);
      border-radius: 50%;
      transform: rotateX(70deg) rotateY(-20deg);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      animation: rotateRing 8s linear infinite;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-12px) scale(1.05); }
    }

    @keyframes rotateRing {
      0% { transform: rotateX(70deg) rotateY(-20deg) rotate(0deg); }
      100% { transform: rotateX(70deg) rotateY(-20deg) rotate(360deg); }
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.3);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-5px);
      border-color: #a855f7;
      box-shadow: 0 20px 40px rgba(139, 92, 246, 0.25);
    }

    .drag-drop-area {
      border: 2px dashed rgba(168, 85, 247, 0.4);
      background: rgba(15, 23, 42, 0.7);
      transition: all 0.2s ease;
    }
    .drag-drop-area.dragover {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.2);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
  </style>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
        authDomain: "bca-learning-hub.firebaseapp.com",
        databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bca-learning-hub",
        storageBucket: "bca-learning-hub.firebasestorage.app",
        messagingSenderId: "206989105830",
        appId: "1:206989105830:web:93546fed295efab3017267",
        measurementId: "G-FF3GR0989C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allTopics = {};
    let uploadedDiagramBase64 = "";

    window.onload = function() {
      db.ref('bca_topics').on('value', (snapshot) => {
        const data = snapshot.val();
        allTopics = data || {};
        renderTopicGrid();
      });
    };

    function renderTopicGrid() {
      const container = document.getElementById('topicGridContainer');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = "";

      const keys = Object.keys(allTopics);
      let count = 0;

      keys.forEach(key => {
        const t = allTopics[key];
        const match = t.topicTitle.toLowerCase().includes(searchVal) || 
                      t.subject.toLowerCase().includes(searchVal) || 
                      t.semester.toLowerCase().includes(searchVal);

        if (match) {
          count++;
          container.innerHTML += `
            <div class="glass-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center mb-2">
                  <span class="px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 text-[10px] font-bold">
                    ${t.semester}
                  </span>
                  <span class="text-[11px] text-gray-400 font-medium">
                    <i class="fa-solid fa-book text-purple-400 mr-1"></i>${t.subject}
                  </span>
                </div>
                <h3 class="text-base font-bold text-white mt-2 mb-2">${t.topicTitle}</h3>
                <p class="text-xs text-gray-400 line-clamp-2 mb-4">${t.overview || 'Interactive 3D Study Topic'}</p>
              </div>

              <div class="flex items-center justify-between pt-3 border-t border-purple-500/20">
                <a href="template.html?id=${key}" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs transition flex items-center space-x-1">
                  <span>Open Topic</span>
                  <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </a>
              </div>
            </div>
          `;
        }
      });

      if (count === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 text-gray-400 bg-slate-900/50 rounded-2xl border border-purple-500/20">
            <i class="fa-solid fa-box-open text-4xl mb-3 text-purple-400 opacity-50 block"></i>
            Koi topic nahi mila. Admin panel se naya topic add karein.
          </div>
        `;
      }
    }

    /* Admin Password Authentication */
    function openAdminModal() {
      let pass = prompt("🔑 Enter Admin Password:");
      if (pass === "sagar9955@#") {
        document.getElementById('adminModal').style.display = "flex";
      } else if (pass !== null) {
        alert("❌ Incorrect Password!");
      }
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = "none";
    }

    /* Drag & Drop Image Handler */
    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.remove('dragover');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.remove('dragover');

      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        processDiagramFile(files[0]);
      }
    }

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files && files.length > 0) {
        processDiagramFile(files[0]);
      }
    }

    function processDiagramFile(file) {
      if (!file.type.startsWith('image/')) {
        return alert("⚠️ Kripya sirf image file (PNG, JPG, SVG) upload karein!");
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedDiagramBase64 = evt.target.result;
        document.getElementById('imagePreview').src = uploadedDiagramBase64;
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('dropZoneText').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeDiagramImage() {
      uploadedDiagramBase64 = "";
      document.getElementById('imagePreview').src = "";
      document.getElementById('previewContainer').classList.add('hidden');
      document.getElementById('dropZoneText').classList.remove('hidden');
      document.getElementById('diagramFileInput').value = "";
    }

    /* Save Topic Data to Firebase */
    function saveTopicData(e) {
      e.preventDefault();

      let payload = {
        semester: document.getElementById('topicSem').value,
        subject: document.getElementById('topicSubject').value.trim(),
        topicTitle: document.getElementById('topicTitle').value.trim(),
        overview: document.getElementById('topicOverview').value.trim(),
        glbUrl: document.getElementById('topicGlbUrl').value.trim(),
        diagramBase64: uploadedDiagramBase64,
        definitionText: document.getElementById('topicDef').value.trim(),
        labCode: document.getElementById('topicLabCode').value.trim(),
        timestamp: new Date().toLocaleString()
      };

      db.ref('bca_topics').push(payload).then(() => {
        alert("🎉 Topic Published Successfully!");
        document.getElementById('topicForm').reset();
        removeDiagramImage();
        closeAdminModal();
      });
    }
  </script>
</head>

        <span>Admin Panel</span>

  <!-- Hero & 3D Interactive Center -->
  <main class="w-full max-w-6xl my-auto py-4 z-10">

    <div class="orb-3d-container">
      <div class="orb-ring"></div>
      <div class="orb-core"></div>
    </div>

    <!-- Hero Header -->
    <div class="text-center max-w-2
