<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Learning Hub - 3D 360° Immersive Wallpaper</title>
  
  <!-- Firebase Classic Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      overflow-x: hidden;
      user-select: none;
    }

    .viewport-3d {
      perspective: 1500px;
      transform-style: preserve-3d;
    }

    .wallpaper-3d-card {
      transform-style: preserve-3d;
      will-change: transform;
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.95),
        0 0 50px rgba(99, 102, 241, 0.3),
        inset 0 1px 2px rgba(255, 255, 255, 0.2);
      cursor: grab;
    }

    .wallpaper-3d-card:active {
      cursor: grabbing;
    }

    .glass-panel {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .neon-border {
      position: relative;
    }
    .neon-border::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 1.75rem;
      padding: 2px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899, #10b981, #3b82f6);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .circuit-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.18) 0%, rgba(3, 7, 18, 0.98) 75%),
        linear-gradient(rgba(16, 185, 129, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 45px 45px, 45px 45px;
    }

    .drag-drop-area {
      border: 2px dashed rgba(168, 85, 247, 0.4);
      background: rgba(15, 23, 42, 0.7);
      transition: all 0.2s ease;
    }
    .drag-drop-area.dragover {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.2);
    }

    .search-results-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 8px;
      background: rgba(11, 19, 43, 0.98);
      border: 1px solid #4cc9f0;
      border-radius: 12px;
      z-index: 100;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .search-result-item { padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: left; cursor: pointer; transition: 0.2s; color: #fff; font-size: 0.9rem; }
    .search-result-item:hover { background: rgba(58, 134, 255, 0.3); color: #4cc9f0; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
        authDomain: "bca-learning-hub.firebaseapp.com",
        databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bca-learning-hub",
        storageBucket: "bca-learning-hub.firebasestorage.app",
        messagingSenderId: "206989105830",
        appId: "1:206989105830:web:93546fed295efab3017267",
        measurementId: "G-FF3GR0989C"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allSearchableItems = [];
    let uploadedDiagramBase64 = "";

    window.onload = function() {
        db.ref('bca_topics').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([id, item]) => {
                    allSearchableItems.push({
                        id: id,
                        title: item.title,
                        type: 'topic',
                        semester: item.semester,
                        url: `template.html?id=${id}`
                    });
                });
            }
        });

        db.ref('bca_quizzes').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([id, item]) => {
                    allSearchableItems.push({
                        id: id,
                        title: item.topic || "Quiz Set",
                        type: 'quiz',
                        semester: item.semester,
                        url: `quiz.html?id=${id}`
                    });
                });
            }
        });
        
        applyTransform();
    };

    function handleSearchInput(query) {
        const resultsBox = document.getElementById("searchResults");
        resultsBox.innerHTML = "";
        
        if (!query.trim()) {
            resultsBox.style.display = "none";
            return;
        }

        const filtered = allSearchableItems.filter(item => item.title.toLowerCase().includes(query.toLowerCase()));

        if (filtered.length > 0) {
            resultsBox.style.display = "block";
            filtered.forEach(item => {
                let icon = item.type === 'topic' ? '📖 [Topic]' : '⚡ [Quiz]';
                resultsBox.innerHTML += `
                    <div class="search-result-item" onclick="window.location.href='${item.url}'">
                        ${icon} <strong>${item.title}</strong> <small style="color: #ff9800;">(${item.semester})</small>
                    </div>
                `;
            });
        } else {
            resultsBox.style.display = "block";
            resultsBox.innerHTML = `<div class="search-result-item" style="color: #8d99ae;">❌ Kuch nahi mila "${query}" ke liye</div>`;
        }
    }

    /* Updated Admin Password to sagar9955@# */
    function toggleAdminLogin() {
        let pass = prompt("🔑 Enter Owner Password:");
        if (pass === "sagar9955@#") {
            sessionStorage.setItem("bca_admin_auth", "true");
            alert("Welcome Admin! Topic Designer Panel Unlocked.");
            document.getElementById("adminTopicPanel").style.display = "block";
        } else if(pass !== null) {
            alert("Wrong Password!");
        }
    }

    /* Drag & Drop Image Handlers */
    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.remove('dragover');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropZone').classList.remove('dragover');

      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        processDiagramFile(files[0]);
      }
    }

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files && files.length > 0) {
        processDiagramFile(files[0]);
      }
    }

    function processDiagramFile(file) {
      if (!file.type.startsWith('image/')) {
        return alert("⚠️ Kripya sirf image file (PNG, JPG, SVG) upload karein!");
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedDiagramBase64 = evt.target.result;
        document.getElementById('imagePreview').src = uploadedDiagramBase64;
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('dropZoneText').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeDiagramImage() {
      uploadedDiagramBase64 = "";
      document.getElementById('imagePreview').src = "";
      document.getElementById('previewContainer').classList.add('hidden');
      document.getElementById('dropZoneText').classList.remove('hidden');
      document.getElementById('diagramFileInput').value = "";
    }

    function saveTopicData(e) {
        e.preventDefault();
        let topicObject = {
            semester: document.getElementById("topicSem").value,
            title: document.getElementById("topicTitle").value,
            definition: document.getElementById("topicDef").value,
            qa: document.getElementById("topicQA").value,
            models: document.getElementById("topicModels").value.split(',').map(i => i.trim()).filter(i => i !== ""),
            lab: document.getElementById("topicLab").value,
            diagramBase64: uploadedDiagramBase64,
            timestamp: new Date().toLocaleString()
        };

        db.ref('bca_topics').push(topicObject).then(() => {
            alert("🎉 Topic Published Successfully with Diagram!");
            document.getElementById("topicForm").reset();
            removeDiagramImage();
        });
    }
  </script>
</head>
