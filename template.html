<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Topic Viewer - 3D Notebook Edition</title>

    <!-- Firebase Classic Compatibility Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Google Model Viewer for 3D Models Support -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: #0f172a;
            color: #333;
            min-height: 100vh;
            padding-bottom: 80px;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        nav { 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px 30px; 
            z-index: 1000; 
            border-bottom: 2px solid #b91c1c; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .logo-area h2 { font-size: 1.2rem; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .logo-area span { font-size: 0.75rem; color: #38bdf8; display: block; letter-spacing: 1px; font-family: 'Segoe UI', sans-serif; }

        .nav-menu { display: flex; gap: 15px; list-style: none; align-items: center; font-family: 'Segoe UI', sans-serif; }
        .nav-menu a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; padding: 6px 14px; border-radius: 8px; transition: 0.3s; }
        .nav-menu a:hover { background: rgba(185, 28, 28, 0.3); color: #fff; }

        .content-container { 
            max-width: 900px; 
            margin: 120px auto 40px auto; 
            padding: 0 20px; 
        }

        /* 3D Notebook Page Style */
        .notebook-page {
            width: 100%;
            min-height: 480px;
            background: #fffef0; /* Cream paper color */
            color: #1e293b;
            padding: 35px 35px 35px 45px;
            border-radius: 4px 16px 16px 4px;
            border-left: 14px solid #b91c1c; /* Binder edge */
            box-shadow: 
                -10px 10px 0px #cbd5e1,
                -20px 20px 0px #94a3b8,
                -25px 25px 30px rgba(0,0,0,0.5);
            transform: rotateX(8deg) rotateY(-8deg) rotateZ(1deg);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            background-image: repeating-linear-gradient(#fffef0 0px, #fffef0 24px, #e2e8f0 25px);
            line-height: 25px;
            margin-bottom: 60px;
            position: relative;
        }

        .notebook-page:hover {
            transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.01);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .notebook-title {
            font-weight: bold;
            font-size: 22px;
            text-decoration: underline;
            margin-bottom: 15px;
            color: #0f172a;
            word-break: break-word;
        }

        .notebook-meta {
            font-size: 13px;
            color: #b91c1c;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .notebook-section {
            margin-bottom: 25px;
            background: rgba(255, 254, 240, 0.85);
            padding: 10px 15px;
            border-radius: 6px;
            border-left: 3px solid #1e293b;
        }

        .notebook-section-title {
            font-weight: bold;
            font-size: 16px;
            color: #0f172a;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notebook-text {
            font-size: 14px;
            color: #334155;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .notebook-code {
            background: #1e293b;
            color: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            margin-top: 8px;
            line-height: 20px;
        }

        /* Q&A Toggle Button */
        .btn-toggle-answer {
            background: #b91c1c;
            color: #fff;
            border: none;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
        }
        .btn-toggle-answer:hover {
            background: #991b1b;
        }
        .qa-answer-content { 
            display: none; 
            margin-top: 10px; 
            padding-top: 10px; 
            border-top: 1px dashed #94a3b8; 
        }

        /* 3D Viewers Grid System */
        .viewers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 12px;
        }

        .viewer-card-wrapper {
            background: #0f172a;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: 0.3s;
        }

        .viewer-card-wrapper:hover {
            border-color: #b91c1c;
            transform: translateY(-4px);
        }

        .viewer-container {
            width: 100%;
            height: 220px;
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .viewer-footer {
            padding: 8px 12px;
            background: #1e293b;
            color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Admin Action Area */
        .admin-action-bar { 
            display: none; 
            margin-top: 20px; 
            padding-top: 12px; 
            border-top: 2px dashed #b91c1c; 
        }
        .btn-admin-del { 
            background: #dc2626; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: 'Segoe UI', sans-serif;
        }

        /* Fullscreen Modal */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px); 
            z-index: 2000; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        .modal-content { 
            width: 90%; 
            max-width: 850px; 
            height: 78vh; 
            background: #fffef0; 
            border: 4px solid #b91c1c; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .modal-header { 
            padding: 12px 20px; 
            background: #0f172a; 
            color: #fff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-family: 'Segoe UI', sans-serif;
        }
        .modal-header h3 { color: #38bdf8; font-size: 1rem; }
        .close-modal-btn { 
            background: #dc2626; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .modal-body { flex: 1; width: 100%; height: 100%; background: #0f172a; }
        .modal-body model-viewer { width: 100%; height: 100%; }

        .no-content { text-align: center; color: #cbd5e1; font-size: 1.1rem; padding: 80px; font-family: 'Segoe UI', sans-serif; }
    </style>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
            authDomain: "bca-learning-hub.firebaseapp.com",
            databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bca-learning-hub",
            storageBucket: "bca-learning-hub.firebasestorage.app",
            messagingSenderId: "206989105830",
            appId: "1:206989105830:web:93546fed295efab3017267",
            measurementId: "G-FF3GR0989C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetTopicId = urlParams.get('id');

            const container = document.getElementById("dynamicTopics");

            db.ref('bca_topics').on('value', (snapshot) => {
                container.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = '<div class="no-content">⏳ Abhi koi topic notebook mein uploaded nahi hai.</div>';
                    return;
                }

                let entries = Object.entries(data);
                if (targetTopicId) {
                    entries = entries.filter(([id, val]) => id === targetTopicId);
                }

                if (entries.length === 0) {
                    container.innerHTML = '<div class="no-content">❌ Yeh notebook page nahi mila. <br><br><a href="index.html" style="color:#38bdf8;">← Home par jayein</a></div>';
                    return;
                }

                entries.forEach(([topicId, item]) => {
                    let viewersHtml = "";
                    if (item.models && item.models.length > 0) {
                        item.models.forEach((modelPath, mIndex) => {
                            let cleanPath = modelPath.trim();
                            if (cleanPath) {
                                viewersHtml += `
                                    <div class="viewer-card-wrapper" onclick="openFullscreenModal('${cleanPath}', '${item.title} - Model ${mIndex + 1}')">
                                        <div class="viewer-container">
                                            <model-viewer src="${cleanPath}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
                                        </div>
                                        <div class="viewer-footer">
                                            <span>📦 3D Model #${mIndex + 1}</span>
                                            <span style="color:#38bdf8;">[Zoom 🔍]</span>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }

                    let cardHtml = `
                        <div class="notebook-page">
                            <div class="notebook-title">${item.title}</div>
                            <div class="notebook-meta">📌 ${item.semester} | 🕒 Date: ${item.timestamp || 'Recent'}</div>

                            <div class="notebook-section">
                                <div class="notebook-section-title">📖 Topic Concept & Definition:</div>
                                <div class="notebook-text">${item.definition}</div>
                            </div>

                            ${item.qa ? `
                            <div class="notebook-section">
                                <div class="notebook-section-title">
                                    <span>❓ Important Questions & Answers:</span>
                                    <button class="btn-toggle-answer" onclick="toggleAnswer('${topicId}')" id="btn_qa_${topicId}">👁️ Show Answer</button>
                                </div>
                                <div class="qa-answer-content" id="qa_content_${topicId}">
                                    <div class="notebook-text">${item.qa}</div>
                                </div>
                            </div>` : ''}

                            ${viewersHtml ? `
                            <div class="notebook-section">
                                <div class="notebook-section-title">🧊 Interactive 3D Model Attachment:</div>
                                <div class="viewers-grid">
                                    ${viewersHtml}
                                </div>
                            </div>` : ''}

                            ${item.lab ? `
                            <div class="notebook-section">
                                <div class="notebook-section-title">💻 Practical Lab Code Task:</div>
                                <div class="notebook-code">${item.lab}</div>
                            </div>` : ''}

                            <div class="admin-action-bar" id="admin_bar_${topicId}">
                                <button class="btn-admin-del" onclick="deleteTopic('${topicId}')">🗑️ Delete Notebook Page</button>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHtml;
                });

                if(sessionStorage.getItem("bca_admin_auth") === "true") {
                    document.querySelectorAll('.admin-action-bar').forEach(bar => bar.style.display = "block");
                }
            });
        };

        function toggleAnswer(topicId) {
            const content = document.getElementById(`qa_content_${topicId}`);
            const btn = document.getElementById(`btn_qa_${topicId}`);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.innerHTML = "👁️ Show Answer";
            } else {
                content.style.display = "block";
                btn.innerHTML = "🔒 Hide Answer";
            }
        }

        function verifyAdminForView() {
            let pass = prompt("🔐 Enter Admin Password:");
            if (pass === "BCA@Admin#2026!Secured") {
                sessionStorage.setItem("bca_admin_auth", "true");
                document.querySelectorAll('.admin-action-bar').forEach(bar => bar.style.display = "block");
                alert("Admin Mode Unlocked!");
            } else if(pass !== null) {
                alert("Wrong Password!");
            }
        }

        function deleteTopic(topicId) {
            if (confirm("⚠️ Is notebook page ko permanently delete karna chahte hain?")) {
                db.ref('bca_topics/' + topicId).remove()
                  .then(() => { alert("🗑️ Page Deleted!"); window.location.href = "index.html"; });
            }
        }

        function openFullscreenModal(modelSrc, modelTitle) {
            document.getElementById("modalTitle").innerText = modelTitle;
            document.getElementById("modalViewerContainer").innerHTML = `<model-viewer src="${modelSrc}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1"></model-viewer>`;
            document.getElementById("fullscreenModal").style.display = "flex";
        }

        function closeFullscreenModal() {
            document.getElementById("fullscreenModal").style.display = "none";
            document.getElementById("modalViewerContainer").innerHTML = "";
        }
    </script>
</head>
<body>

    <nav>
        <div class="logo-area">
            <h2>🎓 BCA Learning Hub</h2>
            <span>3D Immersive Notebook</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html">⚡ Quiz Arena</a></li>
            <li><a href="#" onclick="verifyAdminForView()" style="color: #f87171; font-size: 0.85rem;">🔐 Admin Mode</a></li>
        </ul>
    </nav>

    <div class="content-container">
        <div id="dynamicTopics">
            <div class="no-content">⏳ Loading 3D Notebook Pages...</div>
        </div>
    </div>

    <div class="modal-overlay" id="fullscreenModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">3D Model Interactive View</h3>
                <button class="close-modal-btn" onclick="closeFullscreenModal()">❌ Close [X]</button>
            </div>
            <div class="modal-body" id="modalViewerContainer"></div>
        </div>
    </div>

</body>
</html>
