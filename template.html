<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Topic Viewer - Futuristic 3D HUD Interface</title>

    <!-- Firebase Classic Compatibility Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Google Model Viewer for 3D Models Support -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { 
            background: #0a0c16; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108, 99, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
                linear-gradient(rgba(10, 12, 22, 0.85), rgba(5, 7, 15, 0.95)),
                url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            color: #fff; 
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* Sci-Fi Navigation Bar */
        nav { 
            background: rgba(10, 12, 22, 0.85); 
            backdrop-filter: blur(15px); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px 30px; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(108, 99, 255, 0.3); 
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.2);
        }
        .logo-area h2 { font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px #6c63ff; }
        .logo-area span { font-size: 0.7rem; color: #4cc9f0; display: block; letter-spacing: 1.5px; font-weight: bold; }

        .nav-menu { display: flex; gap: 15px; list-style: none; align-items: center; }
        .nav-menu a { color: #d1d1e0; text-decoration: none; font-size: 0.9rem; padding: 6px 14px; border-radius: 8px; transition: 0.3s; }
        .nav-menu a:hover { background: rgba(108, 99, 255, 0.3); color: #fff; box-shadow: 0 0 10px #6c63ff; }

        .content-container { 
            max-width: 900px; 
            margin: 110px auto 40px auto; 
            padding: 0 20px; 
        }

        /* 3D Perspective Container */
        .note-container {
            perspective: 1000px; /* Gives 3D Depth */
            margin-bottom: 45px;
        }

        /* Futuristic 3D Note Card */
        .note-card {
            width: 100%;
            background: linear-gradient(135deg, rgba(30, 30, 47, 0.95), rgba(42, 42, 64, 0.95));
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 
                        0 0 25px rgba(108, 99, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transform-style: preserve-3d;
            transition: transform 0.6s ease, box-shadow 0.6s ease, border-color 0.6s ease;
            position: relative;
            backdrop-filter: blur(12px);
        }

        /* 3D Cyberpunk Hover Animation */
        .note-container:hover .note-card {
            transform: rotateY(4deg) rotateX(2deg) translateZ(10px);
            box-shadow: -15px 25px 50px rgba(0, 0, 0, 0.8), 
                        0 0 35px rgba(108, 99, 255, 0.45);
            border-color: rgba(108, 99, 255, 0.6);
        }

        .note-header {
            border-bottom: 2px solid #6c63ff;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .note-title {
            font-size: 24px;
            color: #6c63ff;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(108, 99, 255, 0.5);
            font-weight: 800;
        }

        .note-body {
            font-size: 15px;
            line-height: 1.7;
            color: #d1d1e0;
        }

        /* Section Sub-boxes inside Card */
        .hud-section {
            background: rgba(10, 12, 22, 0.6);
            border-left: 4px solid #6c63ff;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hud-section h3 {
            color: #4cc9f0;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-section p, .hud-section pre {
            color: #e2e8f0;
            font-size: 0.98rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .hud-section pre {
            background: rgba(5, 7, 15, 0.9);
            padding: 14px;
            border-radius: 8px;
            color: #38bdf8;
            font-family: monospace;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-top: 8px;
        }

        /* Sci-Fi Badge */
        .note-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6c63ff, #3a86ff);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(108, 99, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .status-active {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        /* Q&A Hide/Show Toggle Button */
        .btn-toggle-answer {
            background: rgba(108, 99, 255, 0.2);
            color: #4cc9f0;
            border: 1px solid #6c63ff;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-toggle-answer:hover {
            background: #6c63ff;
            color: #fff;
            box-shadow: 0 0 10px #6c63ff;
        }
        .qa-answer-content { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(108, 99, 255, 0.4); }

        /* 3D Viewers Grid */
        .viewers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 15px;
        }
        .viewer-card-wrapper {
            background: rgba(5, 7, 15, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(108, 99, 255, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: 0.3s;
        }
        .viewer-card-wrapper:hover {
            transform: translateY(-5px);
            border-color: #4cc9f0;
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.4);
        }
        .viewer-container { width: 100%; height: 230px; background: radial-gradient(circle, #1e1e2f 0%, #0a0c16 100%); }
        model-viewer { width: 100%; height: 100%; }
        .viewer-footer {
            padding: 10px 14px;
            background: rgba(15, 18, 30, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(108, 99, 255, 0.2);
            font-size: 0.85rem;
        }

        /* Admin Action Controls */
        .admin-action-bar { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-admin-del { background: #ef4444; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Fullscreen Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 15, 0.95); backdrop-filter: blur(15px); z-index: 2000; justify-content: center; align-items: center; padding: 25px; }
        .modal-content { width: 90%; max-width: 900px; height: 80vh; background: #1e1e2f; border: 2px solid #6c63ff; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(108, 99, 255, 0.5); }
        .modal-header { padding: 15px 22px; background: #0a0c16; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(108, 99, 255, 0.3); }
        .modal-header h3 { color: #4cc9f0; font-size: 1.1rem; }
        .close-modal-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .modal-body { flex: 1; width: 100%; height: 100%; }
        .modal-body model-viewer { width: 100%; height: 100%; }

        .no-content { text-align: center; color: #a5b4fc; font-size: 1.2rem; padding: 80px; }
    </style>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlnN3WDFMyM9aWy88GyRZUNJk3D1Y-TBE",
            authDomain: "bca-learning-hub.firebaseapp.com",
            databaseURL: "https://bca-learning-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bca-learning-hub",
            storageBucket: "bca-learning-hub.firebasestorage.app",
            messagingSenderId: "206989105830",
            appId: "1:206989105830:web:93546fed295efab3017267",
            measurementId: "G-FF3GR0989C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetTopicId = urlParams.get('id');

            const container = document.getElementById("dynamicTopics");

            db.ref('bca_topics').on('value', (snapshot) => {
                container.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = '<div class="no-content">⏳ Abhi koi topic uploaded nahi hai.</div>';
                    return;
                }

                let entries = Object.entries(data);
                if (targetTopicId) {
                    entries = entries.filter(([id, val]) => id === targetTopicId);
                }

                if (entries.length === 0) {
                    container.innerHTML = '<div class="no-content">❌ Yeh topic nahi mila ya delete ho chuka hai. <br><br><a href="index.html" style="color:#4cc9f0;">← Home par jayein</a></div>';
                    return;
                }

                entries.forEach(([topicId, item]) => {
                    let viewersHtml = "";
                    if (item.models && item.models.length > 0) {
                        item.models.forEach((modelPath, mIndex) => {
                            let cleanPath = modelPath.trim();
                            if (cleanPath) {
                                viewersHtml += `
                                    <div class="viewer-card-wrapper" onclick="openFullscreenModal('${cleanPath}', '${item.title} - Model ${mIndex + 1}')">
                                        <div class="viewer-container">
                                            <model-viewer src="${cleanPath}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
                                        </div>
                                        <div class="viewer-footer">
                                            <span style="color:#d1d1e0;">📦 Model ${mIndex + 1}</span>
                                            <span style="color:#6c63ff; font-weight:bold;">🔍 Expand</span>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }

                    let cardHtml = `
                        <div class="note-container">
                            <div class="note-card">
                                <div class="note-header">
                                    <h2 class="note-title">${item.title}</h2>
                                    <span class="note-badge status-active">${item.semester}</span>
                                </div>
                                
                                <div class="note-body">
                                    <div class="hud-section">
                                        <h3>📖 Objective & Concept Overview</h3>
                                        <p>${item.definition}</p>
                                    </div>

                                    ${item.qa ? `
                                    <div class="hud-section">
                                        <h3>
                                            <span>❓ Important Q&A Module</span>
                                            <button class="btn-toggle-answer" onclick="toggleAnswer('${topicId}')" id="btn_qa_${topicId}">👁️ Reveal Answer</button>
                                        </h3>
                                        <div class="qa-answer-content" id="qa_content_${topicId}">
                                            <p>${item.qa}</p>
                                        </div>
                                    </div>` : ''}

                                    ${viewersHtml ? `
                                    <div class="hud-section">
                                        <h3>🧊 Interactive 3D Holographic Models</h3>
                                        <div class="viewers-grid">
                                            ${viewersHtml}
                                        </div>
                                    </div>` : ''}

                                    ${item.lab ? `
                                    <div class="hud-section">
                                        <h3>💻 Practical Code & Lab Directive</h3>
                                        <pre>${item.lab}</pre>
                                    </div>` : ''}
                                </div>

                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                                    <span class="note-badge">SYNCED: ${item.timestamp || 'ACTIVE'}</span>
                                    <div class="admin-action-bar" id="admin_bar_${topicId}">
                                        <button class="btn-admin-del" onclick="deleteTopic('${topicId}')">🗑️ Delete Card</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHtml;
                });

                if(sessionStorage.getItem("bca_admin_auth") === "true") {
                    document.querySelectorAll('.admin-action-bar').forEach(bar => bar.style.display = "block");
                }
            });
        };

        function toggleAnswer(topicId) {
            const content = document.getElementById(`qa_content_${topicId}`);
            const btn = document.getElementById(`btn_qa_${topicId}`);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.innerHTML = "👁️ Reveal Answer";
            } else {
                content.style.display = "block";
                btn.innerHTML = "🔒 Hide Answer";
            }
        }

        function verifyAdminForView() {
            let pass = prompt("🔐 Enter Admin Password:");
            if (pass === "BCA@Admin#2026!Secured") {
                sessionStorage.setItem("bca_admin_auth", "true");
                document.querySelectorAll('.admin-action-bar').forEach(bar => bar.style.display = "block");
                alert("Admin Mode Unlocked!");
            } else if(pass !== null) {
                alert("Wrong Password!");
            }
        }

        function deleteTopic(topicId) {
            if (confirm("⚠️ Delete this card permanently?")) {
                db.ref('bca_topics/' + topicId).remove()
                  .then(() => { alert("🗑️ Card Deleted!"); window.location.href = "index.html"; });
            }
        }

        function openFullscreenModal(modelSrc, modelTitle) {
            document.getElementById("modalTitle").innerText = modelTitle;
            document.getElementById("modalViewerContainer").innerHTML = `<model-viewer src="${modelSrc}" alt="3D Model" auto-rotate camera-controls shadow-intensity="1"></model-viewer>`;
            document.getElementById("fullscreenModal").style.display = "flex";
        }

        function closeFullscreenModal() {
            document.getElementById("fullscreenModal").style.display = "none";
            document.getElementById("modalViewerContainer").innerHTML = "";
        }
    </script>
</head>
<body>

    <nav>
        <div class="logo-area">
            <h2>🎓 BCA Learning Hub</h2>
            <span>3D Immersive Education</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html">⚡ Quiz Arena</a></li>
            <li><a href="#" onclick="verifyAdminForView()" style="color: #ff9800; font-size: 0.85rem;">🔐 Admin Mode</a></li>
        </ul>
    </nav>

    <div class="content-container">
        <div id="dynamicTopics">
            <div class="no-content">⏳ Loading 3D Hologram Cards...</div>
        </div>
    </div>

    <div class="modal-overlay" id="fullscreenModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">3D Model Hologram Viewer</h3>
                <button class="close-modal-btn" onclick="closeFullscreenModal()">❌ Close [X]</button>
            </div>
            <div class="modal-body" id="modalViewerContainer"></div>
        </div>
    </div>

</body>
</html>
